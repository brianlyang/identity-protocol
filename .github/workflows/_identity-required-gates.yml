name: identity-required-gates

on:
  workflow_call:

jobs:
  validate-identity:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint workflows (actionlint)
        uses: rhysd/actionlint@v1.7.11

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Super-linter (governance required lane)
        uses: super-linter/super-linter/slim@v8.2.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BRANCH: main
          VALIDATE_ALL_CODEBASE: false
          FILTER_REGEX_INCLUDE: '(^\\.github/workflows/.*|^identity/protocol/.*|^docs/governance/.*|^docs/review/.*)$'
          VALIDATE_GITHUB_ACTIONS: true
          VALIDATE_JSON: true
          VALIDATE_MARKDOWN: true
          VALIDATE_YAML: true

      - name: Install ast-grep
        run: npm install -g @ast-grep/cli

      - name: Path governance rules (ast-grep)
        run: sg scan -r .github/ast-grep/no-default-repo-runtime-fallback.yml .

      - name: Validate protocol base
        run: python3 scripts/validate_identity_protocol.py

      - name: Validate governance snapshot index
        run: python3 scripts/validate_audit_snapshot_index.py

      - name: Validate protocol SSOT source boundary
        run: python3 scripts/validate_protocol_ssot_source.py

      - name: Validate control-plane growth budget (v1.6)
        run: python3 scripts/validate_control_plane_budget.py --json-only

      - name: Validate control-plane invariants (v1.6)
        run: python3 scripts/validate_control_plane_invariants.py --json-only

      - name: Validate control-plane status sync (v1.6)
        run: python3 scripts/validate_control_plane_status_sync.py --json-only

      - name: Validate stream version PR boundary (v1.6.8)
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          if [ -n "${PR_BASE_SHA}" ] && [ -n "${PR_HEAD_SHA}" ]; then
            BASE_SHA="${PR_BASE_SHA}"
            HEAD_SHA="${PR_HEAD_SHA}"
          elif [ -n "${PUSH_BEFORE_SHA}" ] && [ "${PUSH_BEFORE_SHA}" != "0000000000000000000000000000000000000000" ]; then
            BASE_SHA="${PUSH_BEFORE_SHA}"
            HEAD_SHA="${CURRENT_SHA}"
          else
            BASE_SHA="$(git rev-parse HEAD~1)"
            HEAD_SHA="$(git rev-parse HEAD)"
          fi
          python3 scripts/validate_stream_version_pr_boundary.py --base "${BASE_SHA}" --head "${HEAD_SHA}" --json-only

      - name: Validate governance docs command contract
        run: python3 scripts/docs_command_contract_check.py

      - name: Validate doc evidence persistence policy (v1.6.2)
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          if [ -n "${PR_BASE_SHA}" ] && [ -n "${PR_HEAD_SHA}" ]; then
            BASE_SHA="${PR_BASE_SHA}"
            HEAD_SHA="${PR_HEAD_SHA}"
          elif [ -n "${PUSH_BEFORE_SHA}" ] && [ "${PUSH_BEFORE_SHA}" != "0000000000000000000000000000000000000000" ]; then
            BASE_SHA="${PUSH_BEFORE_SHA}"
            HEAD_SHA="${CURRENT_SHA}"
          else
            BASE_SHA="$(git rev-parse HEAD~1)"
            HEAD_SHA="$(git rev-parse HEAD)"
          fi
          python3 scripts/validate_doc_evidence_persistence.py --enforce-delta --base "${BASE_SHA}" --head "${HEAD_SHA}" --json-only

      - name: Validate plugin literal path canonicalization
        run: python3 scripts/validate_plugin_contract_literal_paths.py --json-only

      - name: Validate changelog update for significant changes
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          if [ -n "${PR_BASE_SHA}" ] && [ -n "${PR_HEAD_SHA}" ]; then
            BASE_SHA="${PR_BASE_SHA}"
            HEAD_SHA="${PR_HEAD_SHA}"
          elif [ -n "${PUSH_BEFORE_SHA}" ] && [ "${PUSH_BEFORE_SHA}" != "0000000000000000000000000000000000000000" ]; then
            BASE_SHA="${PUSH_BEFORE_SHA}"
            HEAD_SHA="${CURRENT_SHA}"
          else
            BASE_SHA="$(git rev-parse HEAD~1)"
            HEAD_SHA="$(git rev-parse HEAD)"
          fi
          python3 scripts/validate_changelog_updated.py --base "${BASE_SHA}" --head "${HEAD_SHA}"

      - name: Validate release metadata synchronization
        run: python3 scripts/validate_release_metadata_sync.py

      - name: Resolve identity targets for required-gates
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          if [ -n "${PR_BASE_SHA}" ] && [ -n "${PR_HEAD_SHA}" ]; then
            BASE_SHA="${PR_BASE_SHA}"
            HEAD_SHA="${PR_HEAD_SHA}"
          elif [ -n "${PUSH_BEFORE_SHA}" ] && [ "${PUSH_BEFORE_SHA}" != "0000000000000000000000000000000000000000" ]; then
            BASE_SHA="${PUSH_BEFORE_SHA}"
            HEAD_SHA="${CURRENT_SHA}"
          else
            BASE_SHA="$(git rev-parse HEAD~1)"
            HEAD_SHA="$(git rev-parse HEAD)"
          fi
          echo "BASE_SHA=${BASE_SHA}" >> "$GITHUB_ENV"
          echo "HEAD_SHA=${HEAD_SHA}" >> "$GITHUB_ENV"

          IDS=$(BASE_SHA="${BASE_SHA}" HEAD_SHA="${HEAD_SHA}" python3 - <<'PY'
          import os
          import re
          import subprocess
          from pathlib import Path
          import yaml

          catalog = yaml.safe_load(Path("identity/catalog/identities.yaml").read_text()) or {}
          rows = [x for x in catalog.get("identities", []) if isinstance(x, dict)]
          all_ids = [str(x.get("id", "")).strip() for x in rows if str(x.get("id", "")).strip()]
          active_ids = [str(x.get("id", "")).strip() for x in rows if str(x.get("status", "")).strip().lower() == "active" and str(x.get("id", "")).strip()]
          default_id = str(catalog.get("default_identity") or "").strip()

          base = os.environ.get("BASE_SHA", "").strip()
          head = os.environ.get("HEAD_SHA", "").strip()
          p = subprocess.run(["git", "diff", "--name-only", f"{base}..{head}"], capture_output=True, text=True)
          changed = [ln.strip() for ln in p.stdout.splitlines() if ln.strip()]

          changed_ids = []
          for f in changed:
              m = re.match(r"^identity/packs/([^/]+)/", f)
              if m:
                  changed_ids.append(m.group(1))
                  continue
              m = re.match(r"^identity/([^/]+)/", f)
              if m and m.group(1) not in {"runtime", "catalog", "protocol", "packs"}:
                  changed_ids.append(m.group(1))
                  continue
              if f == "identity/catalog/identities.yaml":
                  changed_ids.extend(all_ids)

          ordered = []
          for x in active_ids + ([default_id] if default_id else []) + changed_ids + all_ids:
              if x and x in all_ids and x not in ordered:
                  ordered.append(x)

          print(" ".join(ordered))
          PY
          )
          if [ -z "${IDS}" ]; then
            echo "[FAIL] no identities resolved for required-gates"
            exit 1
          fi
          PRIMARY_ID="$(python3 - <<'PY'
          from pathlib import Path
          import yaml

          catalog = yaml.safe_load(Path("identity/catalog/identities.yaml").read_text()) or {}
          rows = [x for x in (catalog.get("identities") or []) if isinstance(x, dict)]
          all_ids = [str(x.get("id", "")).strip() for x in rows if str(x.get("id", "")).strip()]
          active_ids = [
              str(x.get("id", "")).strip()
              for x in rows
              if str(x.get("status", "")).strip().lower() == "active" and str(x.get("id", "")).strip()
          ]
          default_id = str(catalog.get("default_identity") or "").strip()

          primary = ""
          if active_ids:
              primary = active_ids[0]
          elif default_id and default_id in all_ids:
              primary = default_id
          elif all_ids:
              primary = all_ids[0]

          print(primary)
          PY
          )"
          if [ -z "${PRIMARY_ID}" ]; then
            PRIMARY_ID="$(printf '%s\n' "${IDS}" | awk '{print $1}')"
          fi
          echo "IDS=${IDS}" >> "$GITHUB_ENV"
          echo "PRIMARY_ID=${PRIMARY_ID}" >> "$GITHUB_ENV"
          echo "resolved identities: ${IDS}"

      - name: Validate protocol handoff coupling
        run: python3 scripts/validate_protocol_handoff_coupling.py --base "${BASE_SHA}" --head "${HEAD_SHA}"

      - name: Compile runtime
        run: python3 scripts/compile_identity_runtime.py --identity-id "${PRIMARY_ID}"

      - name: Validate identity manifest + discovery
        run: |
          TMP_ROOT="${RUNNER_TEMP:-${TMPDIR:-${GITHUB_WORKSPACE:-$PWD}/.tmp-runtime}}"
          mkdir -p "${TMP_ROOT}"
          python3 scripts/validate_identity_manifest.py
          python3 scripts/test_identity_discovery_contract.py >"${TMP_ROOT}/identity_discovery_contract.protocol_repo.json"

      - name: Validate required runtime gates across resolved identities
        run: |
          BASE_SHA="${BASE_SHA:-$(git rev-parse HEAD~1)}"
          HEAD_SHA="${HEAD_SHA:-$(git rev-parse HEAD)}"
          IDS="${IDS:-}"
          # delegated fail-close entry:
          # scripts/required_gate_bundle_runner.py
          # scripts/validate_required_gate_recurrence_escalator.py
          # scripts/validate_required_gate_tuple_parity.py
          bash scripts/ci/run_required_runtime_gates_ci.sh "${IDS}" "${BASE_SHA}" "${HEAD_SHA}"

      - name: Validate monotonic floor probes (v1.6.4)
        run: bash scripts/ci/run_monotonic_floor_probes_ci.sh

      - name: Validate gateway wrapper trust boundary probes (v1.6.6)
        run: bash scripts/ci/run_gateway_wrapper_trust_boundary_probes_ci.sh

      - name: Validate host visible surface live probes (v1.6.6)
        run: bash scripts/ci/run_host_visible_surface_live_probes_ci.sh

      - name: Validate downsink path immutability probes (v1.6.8)
        run: bash scripts/ci/run_downsink_path_immutability_probes_ci.sh

      - name: Validate full-scan target regression (p0=0)
        run: |
          IDS="${IDS:-}"
          bash scripts/ci/run_full_scan_target_regression_ci.sh "${IDS}"

      - name: Identity creator protocol checks
        run: bash skills/identity-creator/scripts/validate_identity_protocol.sh .

      - name: Check generated runtime brief is up to date
        run: git diff --exit-code -- identity/runtime/IDENTITY_COMPILED.md
