<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="980" viewBox="0 0 1440 980">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fbff"/>
      <stop offset="100%" stop-color="#eef7ff"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <style>
      .title { font: 700 30px Inter, Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 15px Inter, Arial, sans-serif; fill: #334155; }
      .section { font: 700 18px Inter, Arial, sans-serif; fill: #0f172a; }
      .boxTitle { font: 700 20px Inter, Arial, sans-serif; fill: #0f172a; }
      .boxLine { font: 400 13px Inter, Arial, sans-serif; fill: #1e293b; }
      .chip { font: 700 12px Inter, Arial, sans-serif; fill: #0f172a; }
      .warnTitle { font: 700 16px Inter, Arial, sans-serif; fill: #7f1d1d; }
      .warnLine { font: 400 13px Inter, Arial, sans-serif; fill: #7f1d1d; }
    </style>
  </defs>

  <rect x="0" y="0" width="1440" height="980" fill="url(#bg)"/>
  <text x="48" y="56" class="title">Identity Protocol · Family Viability Model</text>
  <text x="48" y="86" class="subtitle">A family is viable only when frozen semantics, fixed roots, shared infrastructure, and active replay all line up together</text>

  <rect x="64" y="148" width="210" height="124" rx="20" fill="#dbeafe" stroke="#60a5fa" stroke-width="2" filter="url(#shadow)"/>
  <text x="88" y="182" class="boxTitle">1 · Semantic owner</text>
  <text x="88" y="208" class="boxLine">Governance + motherline freeze the family name,</text>
  <text x="88" y="229" class="boxLine">non-goals, and owner boundary.</text>
  <rect x="88" y="240" width="96" height="24" rx="12" fill="#fff" stroke="#93c5fd"/><text x="102" y="256" class="chip">SSOT frozen</text>

  <rect x="330" y="148" width="210" height="124" rx="20" fill="#dbeafe" stroke="#60a5fa" stroke-width="2" filter="url(#shadow)"/>
  <text x="354" y="182" class="boxTitle">2 · Canonical root</text>
  <text x="354" y="208" class="boxLine">Fixed path family is unique and collision-free;</text>
  <text x="354" y="229" class="boxLine">no ad-hoc sink or path drift.</text>
  <rect x="354" y="240" width="116" height="24" rx="12" fill="#fff" stroke="#93c5fd"/><text x="368" y="256" class="chip">root frozen</text>

  <rect x="596" y="148" width="210" height="124" rx="20" fill="#dcfce7" stroke="#4ade80" stroke-width="2" filter="url(#shadow)"/>
  <text x="620" y="182" class="boxTitle">3 · Shared producer</text>
  <text x="620" y="208" class="boxLine">Not a pack-local folklore step;</text>
  <text x="620" y="229" class="boxLine">shared creation / backfill / runtime bridge exists.</text>
  <rect x="620" y="240" width="138" height="24" rx="12" fill="#fff" stroke="#86efac"/><text x="634" y="256" class="chip">producer landed</text>

  <rect x="862" y="148" width="230" height="124" rx="20" fill="#dcfce7" stroke="#4ade80" stroke-width="2" filter="url(#shadow)"/>
  <text x="886" y="182" class="boxTitle">4 · Shared consumer / validator</text>
  <text x="886" y="208" class="boxLine">Shared validator / probe / required gate</text>
  <text x="886" y="229" class="boxLine">actually consumes the family.</text>
  <rect x="886" y="240" width="154" height="24" rx="12" fill="#fff" stroke="#86efac"/><text x="900" y="256" class="chip">consumer landed</text>

  <rect x="1148" y="148" width="228" height="124" rx="20" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2" filter="url(#shadow)"/>
  <text x="1172" y="182" class="boxTitle">5 · Active replay</text>
  <text x="1172" y="208" class="boxLine">Live identities replay the lane where</text>
  <text x="1172" y="229" class="boxLine">that family is expected to operate.</text>
  <rect x="1172" y="240" width="128" height="24" rx="12" fill="#fff" stroke="#c4b5fd"/><text x="1186" y="256" class="chip">replay proven</text>

  <path d="M 274 210 C 295 210, 305 210, 330 210" fill="none" stroke="#2563eb" stroke-width="5" marker-end="url(#arrowBlue)"/>
  <path d="M 540 210 C 561 210, 571 210, 596 210" fill="none" stroke="#2563eb" stroke-width="5" marker-end="url(#arrowBlue)"/>
  <path d="M 806 210 C 827 210, 837 210, 862 210" fill="none" stroke="#2563eb" stroke-width="5" marker-end="url(#arrowBlue)"/>
  <path d="M 1092 210 C 1113 210, 1123 210, 1148 210" fill="none" stroke="#2563eb" stroke-width="5" marker-end="url(#arrowBlue)"/>

  <rect x="370" y="346" width="700" height="160" rx="28" fill="#ffffff" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)"/>
  <text x="402" y="388" class="boxTitle">Viable governed family</text>
  <text x="402" y="418" class="boxLine">Only when all five signals are simultaneously true can the protocol say the family is alive.</text>
  <text x="402" y="444" class="boxLine">Anything weaker is partial closure, not runtime viability.</text>
  <rect x="402" y="464" width="176" height="28" rx="14" fill="#eff6ff" stroke="#93c5fd"/><text x="418" y="483" class="chip">docs + motherline frozen</text>
  <rect x="596" y="464" width="148" height="28" rx="14" fill="#eff6ff" stroke="#93c5fd"/><text x="614" y="483" class="chip">canonical path</text>
  <rect x="760" y="464" width="162" height="28" rx="14" fill="#ecfdf5" stroke="#86efac"/><text x="778" y="483" class="chip">shared producer</text>
  <rect x="938" y="464" width="116" height="28" rx="14" fill="#ecfdf5" stroke="#86efac"/><text x="954" y="483" class="chip">validator lane</text>

  <rect x="72" y="598" width="400" height="206" rx="22" fill="#fef2f2" stroke="#fca5a5" stroke-width="2"/>
  <text x="96" y="636" class="warnTitle">Non-viable false positives</text>
  <text x="96" y="664" class="warnLine">• “The doc exists, so the family exists.”</text>
  <text x="96" y="687" class="warnLine">• “The directory exists, so the line is alive.”</text>
  <text x="96" y="710" class="warnLine">• “One pack patched around it, so protocol closure is done.”</text>
  <text x="96" y="733" class="warnLine">• “Routing green means inherited family semantics are fine.”</text>
  <text x="96" y="756" class="warnLine">All of these are non-canonical.</text>

  <rect x="520" y="598" width="848" height="206" rx="22" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text x="548" y="636" class="boxTitle">Minimum proof package</text>
  <text x="548" y="664" class="boxLine">1. Governance / motherline / term registry freeze the family.</text>
  <text x="548" y="687" class="boxLine">2. Creator / backfill / readiness / gate wiring consume the same family definition.</text>
  <text x="548" y="710" class="boxLine">3. Validator + probe fail-close on drift, collisions, and forbidden promotion.</text>
  <text x="548" y="733" class="boxLine">4. Active identities replay the lane where the family is expected to run.</text>
  <text x="548" y="756" class="boxLine">5. Review / workbook truth-sync records the current live interpretation.</text>

  <rect x="270" y="850" width="900" height="88" rx="20" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
  <text x="298" y="886" class="warnTitle">Architect rule</text>
  <text x="298" y="912" class="warnLine">A family is viable only when semantics, paths, producer/consumer wiring, and active replay all agree. Anything else is drift, staging, or partial closure.</text>
</svg>
