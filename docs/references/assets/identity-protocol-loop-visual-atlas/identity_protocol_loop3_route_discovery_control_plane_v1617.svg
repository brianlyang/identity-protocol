<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fbff"/>
      <stop offset="100%" stop-color="#eef6ff"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <style>
      .title { font: 700 30px Inter, Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 15px Inter, Arial, sans-serif; fill: #334155; }
      .boxTitle { font: 700 20px Inter, Arial, sans-serif; fill: #0f172a; }
      .boxSub { font: 600 13px Inter, Arial, sans-serif; fill: #1d4ed8; }
      .label { font: 700 15px Inter, Arial, sans-serif; fill: #0f172a; }
      .text { font: 400 13px Inter, Arial, sans-serif; fill: #1e293b; }
      .tiny { font: 400 12px Inter, Arial, sans-serif; fill: #475569; }
      .chip { font: 700 12px Inter, Arial, sans-serif; fill: #0f172a; }
      .footer { font: 600 13px Inter, Arial, sans-serif; fill: #7c2d12; }
    </style>
  </defs>
  <rect width="1500" height="980" fill="url(#bg)"/>
  <text x="50" y="54" class="title">Loop 3 Control Plane · Route Discovery Convergence</text>
  <text x="50" y="84" class="subtitle">Kernel Loop 1/2 provide authoritative upstream truth; Loop 3 is the protocol-owned strengthened discovery center under v1.6.17</text>

  <rect x="50" y="120" width="280" height="170" rx="24" fill="#dbeafe" stroke="#60a5fa" stroke-width="2" filter="url(#shadow)"/>
  <text x="72" y="156" class="boxTitle">Loop 1 · Accurate judgement</text>
  <text x="72" y="179" class="boxSub">rq_034_multimodal_plugin_enforcement_contract_v1</text>
  <text x="72" y="208" class="text">• Current-round evidence truth is authoritative</text>
  <text x="72" y="231" class="text">• inconsistent evidence ⇒ block_done</text>
  <text x="72" y="254" class="tiny">validator: scripts/validate_multimodal_plugin_enforcement.py</text>

  <rect x="50" y="330" width="280" height="190" rx="24" fill="#dbeafe" stroke="#60a5fa" stroke-width="2" filter="url(#shadow)"/>
  <text x="72" y="366" class="boxTitle">Loop 2 · Reasoning loop</text>
  <text x="72" y="389" class="boxSub">rq_035_reasoning_loop_failclose_contract_v1</text>
  <text x="72" y="418" class="text">• No-target-reached cannot count as done</text>
  <text x="72" y="441" class="text">• Missing next_action / escalation ⇒ fail-close</text>
  <text x="72" y="464" class="text">• Unresolved reasoning is what escalates into governed discovery</text>
  <text x="72" y="487" class="tiny">validator: scripts/validate_reasoning_loop_failclose.py</text>

  <rect x="390" y="120" width="620" height="560" rx="28" fill="#dcfce7" stroke="#4ade80" stroke-width="2" filter="url(#shadow)"/>
  <text x="420" y="160" class="boxTitle">Loop 3 strengthened center</text>
  <text x="420" y="183" class="boxSub">route_discovery_convergence_contract_v1</text>

  <text x="420" y="228" class="label">What this center freezes</text>
  <text x="440" y="254" class="text">• Persistent uncertainty must trigger discovery; it cannot stay narrative-only</text>
  <text x="440" y="278" class="text">• Candidate comparison may fan out in parallel, but acceptance must converge serially</text>
  <text x="440" y="302" class="text">• Rejected candidates must remain visible; they cannot disappear into chat residue</text>
  <text x="440" y="326" class="text">• Selected route failure must preserve governed fallback / escalation</text>

  <text x="420" y="374" class="label">Machine-visible evidence family</text>
  <rect x="438" y="392" width="220" height="28" rx="14" fill="#ffffff" stroke="#86efac"/><text x="454" y="411" class="chip">trigger_reason / uncertainty_type</text>
  <rect x="674" y="392" width="180" height="28" rx="14" fill="#ffffff" stroke="#86efac"/><text x="691" y="411" class="chip">candidate_rows</text>
  <rect x="438" y="432" width="188" height="28" rx="14" fill="#ffffff" stroke="#86efac"/><text x="452" y="451" class="chip">selected_candidate_id</text>
  <rect x="642" y="432" width="152" height="28" rx="14" fill="#ffffff" stroke="#86efac"/><text x="669" y="451" class="chip">selection_basis</text>
  <rect x="810" y="432" width="164" height="28" rx="14" fill="#ffffff" stroke="#86efac"/><text x="830" y="451" class="chip">convergence_status</text>
  <rect x="438" y="472" width="246" height="28" rx="14" fill="#ffffff" stroke="#86efac"/><text x="454" y="491" class="chip">fallback_route_if_selected_fails</text>
  <rect x="700" y="472" width="220" height="28" rx="14" fill="#ffffff" stroke="#86efac"/><text x="717" y="491" class="chip">route_discovery_convergence_status</text>
  <rect x="438" y="512" width="190" height="28" rx="14" fill="#ffffff" stroke="#86efac"/><text x="454" y="531" class="chip">third_loop_exploration_status</text>

  <text x="420" y="584" class="label">Shared validator / consumer lane</text>
  <text x="440" y="610" class="text">• scripts/validate_identity_routing_learning_strengthening.py</text>
  <text x="440" y="634" class="text">• supporting: validate_capability_fit_roundtable_evidence / validate_discovery_requiredization</text>
  <text x="440" y="658" class="text">• supporting: validate_identity_orchestration_contract / validate_identity_knowledge_contract</text>

  <rect x="1080" y="120" width="360" height="220" rx="24" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" stroke-dasharray="8 6" filter="url(#shadow)"/>
  <text x="1105" y="156" class="boxTitle">Shared primitive</text>
  <text x="1105" y="179" class="boxSub">roundtable_four_track_cross_validation_contract_v1</text>
  <text x="1105" y="208" class="text">• roundtable</text>
  <text x="1105" y="232" class="text">• vendor / official capability</text>
  <text x="1105" y="256" class="text">• reference / specification</text>
  <text x="1105" y="280" class="text">• runtime probe</text>
  <text x="1105" y="308" class="tiny">Consumed by Loop 3 and Loop 4; not itself the bridge or first-loop truth</text>

  <rect x="1080" y="400" width="360" height="220" rx="24" fill="#dcfce7" stroke="#4ade80" stroke-width="2" filter="url(#shadow)"/>
  <text x="1105" y="436" class="boxTitle">Downstream into Loop 4</text>
  <text x="1105" y="459" class="boxSub">feedback_operational_prompt_contract_v1</text>
  <text x="1105" y="488" class="text">• Selected route and accepted evidence move into governed learning</text>
  <text x="1105" y="512" class="text">• Loop 4 may promote derived prompt artifacts only after replay/rollback/TTL constraints</text>
  <text x="1105" y="540" class="tiny">Loop 3 does not collapse into Loop 4; it hands off governed route truth, not final learning truth</text>

  <path d="M 330 205 C 355 205, 365 205, 390 205" fill="none" stroke="#2563eb" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M 330 430 C 355 430, 365 430, 390 430" fill="none" stroke="#2563eb" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M 1010 250 C 1040 250, 1050 250, 1080 250" fill="none" stroke="#2563eb" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M 1010 520 C 1040 520, 1050 520, 1080 520" fill="none" stroke="#2563eb" stroke-width="5" marker-end="url(#arrow)"/>

  <rect x="50" y="740" width="1390" height="170" rx="24" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
  <text x="76" y="778" class="boxTitle">Adjudication freeze for Loop 3</text>
  <text x="76" y="808" class="footer">1. Loop 3 is already beyond “suggest route exploration”; it is now a governed convergence center with explicit candidate comparison and serial acceptance.</text>
  <text x="76" y="834" class="footer">2. Kernel Loop 1/2 remain upstream authority. Loop 3 cannot reinterpret first-loop truth or second-loop fail-close semantics.</text>
  <text x="76" y="860" class="footer">3. The shared four-track primitive is consumed by Loop 3, but it is not the loop itself and not the 4→1 bridge.</text>
  <text x="76" y="886" class="footer">4. Any future change that removes selected_candidate_id / selection_basis / convergence_status visibility should be treated as semantic regression.</text>
</svg>