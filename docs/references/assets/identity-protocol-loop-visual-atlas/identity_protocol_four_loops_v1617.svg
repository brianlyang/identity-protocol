<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="980" viewBox="0 0 1400 980">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fbff"/>
      <stop offset="100%" stop-color="#eef4ff"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
    <style>
      .title { font: 700 30px Inter, Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 15px Inter, Arial, sans-serif; fill: #334155; }
      .section { font: 700 18px Inter, Arial, sans-serif; fill: #0f172a; }
      .small { font: 400 13px Inter, Arial, sans-serif; fill: #334155; }
      .tiny { font: 400 12px Inter, Arial, sans-serif; fill: #475569; }
      .chip { font: 700 12px Inter, Arial, sans-serif; fill: #0f172a; }
      .boxTitle { font: 700 20px Inter, Arial, sans-serif; fill: #0f172a; }
      .boxSub { font: 600 13px Inter, Arial, sans-serif; fill: #1d4ed8; }
      .boxLine { font: 400 13px Inter, Arial, sans-serif; fill: #1e293b; }
      .calloutTitle { font: 700 16px Inter, Arial, sans-serif; fill: #7c2d12; }
      .calloutLine { font: 400 13px Inter, Arial, sans-serif; fill: #7c2d12; }
      .legend { font: 600 13px Inter, Arial, sans-serif; fill: #334155; }
    </style>
  </defs>

  <rect x="0" y="0" width="1400" height="980" fill="url(#bg)"/>

  <text x="48" y="56" class="title">Identity Protocol · Four-Loop Control Plane + 4→1 Bounded Loopback</text>
  <text x="48" y="86" class="subtitle">Human adjudication view · Loop 1/2 kernel owners + Loop 3/4 strengthened centers + governed feedback→judgement bridge</text>

  <rect x="48" y="110" width="1304" height="56" rx="16" fill="#ffffff" opacity="0.95" stroke="#dbeafe"/>
  <circle cx="82" cy="138" r="10" fill="#dbeafe"/>
  <text x="100" y="143" class="legend">Kernel loops = authoritative source contracts</text>
  <circle cx="408" cy="138" r="10" fill="#dcfce7"/>
  <text x="426" y="143" class="legend">Strengthened centers = protocol-owned machine-consumed upper-layer lanes</text>
  <circle cx="883" cy="138" r="10" fill="#ede9fe"/>
  <text x="901" y="143" class="legend">4→1 bridge = governed preflight aid only, never current-round truth</text>

  <!-- Loop 1 -->
  <rect x="50" y="210" width="270" height="240" rx="24" fill="#dbeafe" stroke="#60a5fa" stroke-width="2" filter="url(#shadow)"/>
  <text x="72" y="245" class="boxTitle">Loop 1 · Accurate judgement</text>
  <text x="72" y="268" class="boxSub">rq_034_multimodal_plugin_enforcement_contract_v1</text>
  <text x="72" y="297" class="boxLine">• Current-round evidence truth stays authoritative</text>
  <text x="72" y="320" class="boxLine">• requires_multimodal_evidence_consistency = true</text>
  <text x="72" y="343" class="boxLine">• inconsistent_evidence_transition = block_done</text>
  <text x="72" y="366" class="boxLine">• Canonical validator:</text>
  <text x="92" y="388" class="tiny">scripts/validate_multimodal_plugin_enforcement.py</text>
  <rect x="72" y="406" width="182" height="26" rx="13" fill="#ffffff" stroke="#93c5fd"/>
  <text x="86" y="424" class="chip">multimodal_plugin_enforcement_status</text>

  <!-- Loop 2 -->
  <rect x="50" y="520" width="270" height="240" rx="24" fill="#dbeafe" stroke="#60a5fa" stroke-width="2" filter="url(#shadow)"/>
  <text x="72" y="555" class="boxTitle">Loop 2 · Reasoning loop</text>
  <text x="72" y="578" class="boxSub">rq_035_reasoning_loop_failclose_contract_v1</text>
  <text x="72" y="607" class="boxLine">• No-target-reached cannot count as completion</text>
  <text x="72" y="630" class="boxLine">• Missing next_action / escalation => fail-close</text>
  <text x="72" y="653" class="boxLine">• L1/L2/L3 enforcement remains config-driven</text>
  <text x="72" y="676" class="boxLine">• Canonical validator:</text>
  <text x="92" y="698" class="tiny">scripts/validate_reasoning_loop_failclose.py</text>
  <rect x="72" y="716" width="174" height="26" rx="13" fill="#ffffff" stroke="#93c5fd"/>
  <text x="86" y="734" class="chip">reasoning_loop_failclose_status</text>

  <!-- Loop 3 -->
  <rect x="390" y="190" width="310" height="270" rx="24" fill="#dcfce7" stroke="#4ade80" stroke-width="2" filter="url(#shadow)"/>
  <text x="414" y="226" class="boxTitle">Loop 3 · Route discovery convergence</text>
  <text x="414" y="249" class="boxSub">route_discovery_convergence_contract_v1</text>
  <text x="414" y="278" class="boxLine">• Triggered under persistent uncertainty</text>
  <text x="414" y="301" class="boxLine">• Candidate rows must be machine-auditable</text>
  <text x="414" y="324" class="boxLine">• Parallel exploration allowed, serial acceptance required</text>
  <text x="414" y="347" class="boxLine">• Selected route + rejection basis must stay visible</text>
  <text x="414" y="370" class="boxLine">• Fallback if selected route fails remains governed</text>
  <text x="414" y="393" class="boxLine">• Shared validator lane:</text>
  <text x="434" y="415" class="tiny">scripts/validate_identity_routing_learning_strengthening.py</text>
  <rect x="414" y="430" width="200" height="26" rx="13" fill="#ffffff" stroke="#86efac"/>
  <text x="430" y="448" class="chip">route_discovery_convergence_status</text>

  <!-- Shared primitive -->
  <rect x="410" y="520" width="270" height="150" rx="22" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" stroke-dasharray="8 6" filter="url(#shadow)"/>
  <text x="432" y="554" class="boxTitle">Shared primitive</text>
  <text x="432" y="577" class="boxSub">roundtable_four_track_cross_validation_contract_v1</text>
  <text x="432" y="606" class="boxLine">• Tracks: roundtable / vendor / reference / runtime probe</text>
  <text x="432" y="629" class="boxLine">• Consumed by Loop 3 and Loop 4</text>
  <text x="432" y="652" class="boxLine">• Not a fifth loop and not the 4→1 bridge</text>

  <!-- Loop 4 -->
  <rect x="780" y="190" width="430" height="300" rx="24" fill="#dcfce7" stroke="#4ade80" stroke-width="2" filter="url(#shadow)"/>
  <text x="806" y="226" class="boxTitle">Loop 4 · Feedback operational prompt strengthening</text>
  <text x="806" y="249" class="boxSub">feedback_operational_prompt_contract_v1</text>
  <text x="806" y="278" class="boxLine">• Feedback stays evidence-linked and append-only</text>
  <text x="806" y="301" class="boxLine">• Positive + negative feedback both remain mandatory</text>
  <text x="806" y="324" class="boxLine">• Derived operational prompt is replay-gated / rollback-capable / TTL-bounded</text>
  <text x="806" y="347" class="boxLine">• Does not mutate kernel/system/identity baseline instructions</text>
  <text x="806" y="370" class="boxLine">• Shared validator lane:</text>
  <text x="826" y="392" class="tiny">scripts/validate_identity_routing_learning_strengthening.py</text>
  <rect x="806" y="409" width="216" height="26" rx="13" fill="#ffffff" stroke="#86efac"/>
  <text x="820" y="427" class="chip">feedback_operational_prompt_status</text>
  <rect x="1040" y="409" width="160" height="26" rx="13" fill="#ffffff" stroke="#86efac"/>
  <text x="1054" y="427" class="chip">prompt_injection_status</text>
  <rect x="806" y="445" width="126" height="26" rx="13" fill="#ffffff" stroke="#86efac"/>
  <text x="820" y="463" class="chip">replay_status</text>
  <rect x="948" y="445" width="124" height="26" rx="13" fill="#ffffff" stroke="#86efac"/>
  <text x="962" y="463" class="chip">rollback_prompt_ref</text>
  <rect x="1088" y="445" width="112" height="26" rx="13" fill="#ffffff" stroke="#86efac"/>
  <text x="1115" y="463" class="chip">ttl_rounds</text>

  <!-- Bridge -->
  <rect x="780" y="580" width="430" height="210" rx="24" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2" filter="url(#shadow)"/>
  <text x="806" y="616" class="boxTitle">Governed 4→1 bridge · feedback_to_judgement_loopback_contract_v1</text>
  <text x="806" y="639" class="boxSub">Standalone bridge, not a synonym for Loop 4 and not first-loop truth</text>
  <text x="806" y="668" class="boxLine">• loopback_scope = next_round_preflight_only</text>
  <text x="806" y="691" class="boxLine">• adoption_decision = first_loop_revalidate_before_adopt</text>
  <text x="806" y="714" class="boxLine">• conflict_with_current_evidence = demote_or_rollback_required</text>
  <text x="806" y="737" class="boxLine">• demotion_or_rollback_action = rollback_prompt_ref_and_negative_feedback_writeback</text>
  <rect x="806" y="752" width="214" height="26" rx="13" fill="#ffffff" stroke="#c4b5fd"/>
  <text x="820" y="770" class="chip">feedback_to_judgement_loopback_status</text>
  <rect x="1036" y="752" width="164" height="26" rx="13" fill="#ffffff" stroke="#c4b5fd"/>
  <text x="1062" y="770" class="chip">live_roundtrip_proof_status</text>

  <!-- Arrows -->
  <path d="M 185 450 C 185 490, 185 490, 185 520" fill="none" stroke="#2563eb" stroke-width="5" marker-end="url(#arrowBlue)"/>
  <text x="198" y="490" class="small">truth-preserving handoff</text>

  <path d="M 322 640 C 350 640, 360 640, 390 640" fill="none" stroke="#2563eb" stroke-width="5" marker-end="url(#arrowBlue)"/>
  <text x="334" y="623" class="small">reasoning unresolved → governed route discovery</text>

  <path d="M 545 460 C 545 490, 545 492, 545 520" fill="none" stroke="#2563eb" stroke-width="5" marker-end="url(#arrowBlue)"/>
  <text x="565" y="500" class="small">uses shared four-track primitive</text>

  <path d="M 680 595 C 730 595, 740 430, 780 430" fill="none" stroke="#2563eb" stroke-width="5" marker-end="url(#arrowBlue)"/>
  <text x="687" y="526" class="small">Loop 3 and Loop 4 both consume the primitive</text>

  <path d="M 700 325 C 740 325, 740 325, 780 325" fill="none" stroke="#2563eb" stroke-width="5" marker-end="url(#arrowBlue)"/>
  <text x="707" y="306" class="small">selected route + evidence-linked outputs</text>

  <path d="M 995 490 C 995 530, 995 540, 995 580" fill="none" stroke="#7c3aed" stroke-width="5" marker-end="url(#arrowPurple)"/>
  <text x="1014" y="538" class="small">promoted operational prompt artifact</text>

  <path d="M 780 660 C 630 660, 560 115, 250 210" fill="none" stroke="#7c3aed" stroke-width="5" marker-end="url(#arrowPurple)"/>
  <text x="560" y="146" class="section">4→1 bounded loopback = governed preflight aid only</text>
  <text x="560" y="168" class="small">First-loop revalidation remains authoritative even after reentry</text>

  <path d="M 320 252 C 460 130, 990 120, 1080 580" fill="none" stroke="#dc2626" stroke-width="4" stroke-dasharray="10 8" marker-end="url(#arrowRed)"/>
  <text x="1030" y="156" class="calloutTitle">If current evidence conflicts after reentry</text>
  <text x="1030" y="177" class="calloutLine">demote / rollback + negative-feedback writeback</text>

  <!-- Boundary callouts -->
  <rect x="48" y="820" width="628" height="112" rx="20" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
  <text x="72" y="856" class="calloutTitle">Adjudication freeze</text>
  <text x="72" y="882" class="calloutLine">1. Loop 1 and Loop 2 remain kernel-authoritative; Loop 3 and Loop 4 are strengthened upper-layer centers.</text>
  <text x="72" y="904" class="calloutLine">2. Roundtable four-track cross-validation is a shared primitive, not the loopback bridge and not first-loop truth.</text>

  <rect x="712" y="820" width="640" height="112" rx="20" fill="#fef2f2" stroke="#fca5a5" stroke-width="2"/>
  <text x="736" y="856" class="calloutTitle">No semantic collapse allowed</text>
  <text x="736" y="882" class="calloutLine">3. Loopback artifacts may accelerate next-round preflight, but cannot bypass first-loop revalidation.</text>
  <text x="736" y="904" class="calloutLine">4. No downgrade / no backstop / no lagging-pack shortcut may re-enter any of these lanes.</text>
</svg>