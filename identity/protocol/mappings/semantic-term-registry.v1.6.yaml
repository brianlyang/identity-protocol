terms:
  - term_id: catalog_multi_active
    canonical_term: catalog_multi_active
    aliases:
      - "catalog multi-active"
      - "actor-scoped multi-active"
    semantics: "Catalog may contain multiple runtime+active identities; this is not a violation by itself."
    allowed_scope:
      - catalog
      - runtime_status

  - term_id: session_primary_binding
    canonical_term: session_primary_binding
    aliases:
      - "session-primary binding"
      - "strict session single-primary"
      - "会话单主"
    semantics: "In strict lane, actor_id+session_id tuple must bind to one identity and fail-close on drift."
    allowed_scope:
      - strict_lane
      - send_time_gate

  - term_id: no_downgrade_motherline
    canonical_term: no_downgrade_motherline
    aliases:
      - "no downgrade motherline"
      - "no backstop motherline"
      - "兼容只限迁移诊断"
    semantics: "Compatibility, fallback, and bridge surfaces may exist only for migration, replay, or diagnostics; they must not re-enter active defaults, validator green paths, or current-turn runtime truth."
    allowed_scope:
      - governance
      - migration_governance
      - runtime_guard
      - stream_v1_6_10

  - term_id: protocol_generated_gateway_shell
    canonical_term: protocol_generated_gateway_shell
    aliases:
      - "protocol gateway shell"
      - "wrapper strong-control"
      - "protocol-generated wrapper shell"
    semantics: "Thin protocol-controlled boundary shell generated from protocol canonical template; closed set is ingress/egress/session-chain wrappers only."
    allowed_scope:
      - runtime_gate
      - stream_v1_6_10

  - term_id: protocol_controlled_mirror_artifact
    canonical_term: protocol_controlled_mirror_artifact
    aliases:
      - "protocol-controlled mirror"
      - "mirror constrained"
      - "governed mirror artifact"
    semantics: "Protocol-contract-controlled mirror/downsink artifact; schema/path are protocol-governed but it is not gateway shell code."
    allowed_scope:
      - runtime_gate
      - runtime_state
      - runtime_reports
      - stream_v1_6_10

  - term_id: instance_autonomous_runtime
    canonical_term: instance_autonomous_runtime
    aliases:
      - "runtime default autonomy"
      - "instance runtime autonomy"
      - "runtime 默认自治"
    semantics: "Default class for runtime files not explicitly elevated into protocol-controlled mirror or gateway shell governance."
    allowed_scope:
      - instance_runtime
      - stream_v1_6_10

  - term_id: tracked_compiled_brief_artifact
    canonical_term: tracked_compiled_brief_artifact
    aliases:
      - "tracked compiled brief"
      - "governed generated artifact"
      - "compiled runtime brief artifact"
    semantics: "Tracked generated brief artifact consumed by config/docs/review as a compiled model-instructions brief; it is not ordinary runtime evidence/log and not instance-autonomous runtime state."
    allowed_scope:
      - compiled_brief
      - compatibility_path
      - stream_v1_6_10

  - term_id: tracked_compiled_brief_frozen_path
    canonical_term: tracked_compiled_brief_frozen_path
    aliases:
      - "compiled brief frozen path"
      - "tracked compiled brief path"
      - "冻结 compiled brief 路径"
    semantics: "Pass-default path-status term for a tracked compiled brief whose current filesystem location is intentionally frozen by governance; unlike migration labels, it is safe to appear in generated compiled-brief artifacts and positive machine gates."
    allowed_scope:
      - compiled_brief
      - path_status
      - stream_v1_6_10

  - term_id: legacy_canonical_compatibility_path
    canonical_term: legacy_canonical_compatibility_path
    aliases:
      - "legacy canonical path"
      - "compatibility canonical path"
      - "兼容 canonical 路径"
    semantics: "Still-valid canonical compatibility path retained during governance freeze or migration staging; consumers continue to use it until a separately approved migration closes."
    allowed_scope:
      - compatibility_path
      - migration_governance
      - stream_v1_6_10

  - term_id: instance_owned_technical_debt
    canonical_term: instance_owned_technical_debt
    aliases:
      - "instance technical debt"
      - "instance-owned debt"
      - "实例技术债务"
    semantics: "Missing instance-local skills/config/transport/install/replay hygiene and other local recovery obligations remain instance-owned until the instance completes self-heal and proves closure."
    allowed_scope:
      - instance_runtime
      - protocol_feedback_triage
      - escalation_gate
      - stream_v1_6_10

  - term_id: instance_clean_proof
    canonical_term: instance_clean_proof
    aliases:
      - "instance clean proof"
      - "self-heal closure proof"
      - "实例清债证据"
    semantics: "Replayable proof that instance-owned technical debt is closed; required before escalating any remaining issue as protocol residual."
    allowed_scope:
      - protocol_feedback_triage
      - escalation_gate
      - review_acceptance
      - stream_v1_6_10

  - term_id: protocol_residual_issue
    canonical_term: protocol_residual_issue
    aliases:
      - "protocol residual"
      - "shared protocol residual"
      - "协议残留问题"
    semantics: "Shared contract / wiring / validator / CI / governance issue that remains only after instance_clean_proof; unresolved instance-owned technical debt must not be relabeled as protocol residual."
    allowed_scope:
      - governance
      - review
      - protocol_feedback_triage
      - stream_v1_6_10

forbidden_phrases:
  - phrase: "multi-active state is a protocol violation"
    replacement: "catalog_multi_active is allowed; enforce session_primary_binding in strict lanes"
    rationale: "Prevents catalog-lane and session-lane semantics from being conflated."

  - phrase: "all protocol-governed instance runtime files under `runtime/state`, `runtime/gate`, `runtime/plugins`, and `runtime/protocol-feedback`"
    replacement: "runtime default is instance_autonomous_runtime; only protocol_generated_gateway_shell and explicit protocol_controlled_mirror_artifact entries are protocol-governed"
    rationale: "Prevents blanket protocol ownership claims over all runtime files."

  - phrase: "`runtime/gate/protocol_ingress_wrapper.py`, `runtime/gate/protocol_egress_wrapper.py`, and `runtime/gate/protocol_session_chain_wrapper.py` are governed mirrors, not source of truth."
    replacement: "the three wrapper files are protocol_generated_gateway_shell, while protocol_gateway_contract.json is a protocol_controlled_mirror_artifact"
    rationale: "Prevents gateway shell and mirror artifact semantics from being conflated."

  - phrase: "`identity/runtime/IDENTITY_COMPILED.md` is an ordinary runtime artifact."
    replacement: "`identity/runtime/IDENTITY_COMPILED.md` is a tracked_compiled_brief_artifact at a tracked_compiled_brief_frozen_path."
    rationale: "Prevents the compiled brief from being misclassified as runtime evidence/log pollution."

  - phrase: "`identity/runtime/IDENTITY_COMPILED.md` is an instance-autonomous runtime state file."
    replacement: "`identity/runtime/IDENTITY_COMPILED.md` is a tracked_compiled_brief_artifact and must be updated through source-first compile flow."
    rationale: "Prevents autonomous runtime-state semantics from being incorrectly applied to the compiled brief."

  - phrase: "protocol will backstop instance technical debt"
    replacement: "instance_owned_technical_debt remains instance-owned; protocol_residual_issue starts only after instance_clean_proof"
    rationale: "Prevents protocol/instance ownership from collapsing."

  - phrase: "instance may escalate to protocol before self-heal closure"
    replacement: "No instance-clean proof, no protocol escalation."
    rationale: "Prevents unresolved instance debt from being relabeled as protocol residual."

  - phrase: "protocol residual may include unresolved instance configuration or skill debt"
    replacement: "protocol_residual_issue is limited to shared defects that remain after instance_clean_proof"
    rationale: "Prevents instance-local obligations from being pushed into protocol scope."

  - phrase: "compatibility bridge may remain as an active runtime default"
    replacement: "no_downgrade_motherline: compatibility bridges are migration/replay/diagnostic-only"
    rationale: "Prevents compatibility bridges from surviving as active defaults or runtime backstops."

  - phrase: "fallback/backstop may restore current-turn runtime truth"
    replacement: "session_primary_binding + no_downgrade_motherline require fail-close when authoritative runtime truth is missing"
    rationale: "Prevents fallback/backstop language from re-entering current-turn runtime semantics."

scan_roots:
  - identity/protocol/IDENTITY_PROTOCOL.md
  - identity/protocol/IDENTITY_RUNTIME.md

include_active_stream_docs: true
active_stream_registry: identity/protocol/mappings/stream-doc-registry.current.yaml
