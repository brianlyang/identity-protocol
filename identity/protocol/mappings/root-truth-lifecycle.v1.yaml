contract_required_markers:
- This file remains the authoritative root-domain contract for truth-lifecycle law.
- '## Truth-lifecycle law'
- Truth-lifecycle law must also remain machine-readable as separate
  lifecycle-stage, memory-strata, differentiation, proof, limit, and collapse
  row families rather than one narrative truth claim.
- '## Five lifecycle stages'
- '## Memory-bearing lifecycle strata'
- '## Required lifecycle differentiations'
- '## Truth-lifecycle proof discipline'
- '## Truth-lifecycle proof limits'
- '## Non-compliant lifecycle collapses'
- No truth claim may be treated as full operational closure unless all required lifecycle
  stages have been carried through.
anchor_checks:
- rel_path: identity/protocol/IDENTITY_PROTOCOL_DESIGN_PHILOSOPHY.md
  required_markers:
  - '### Truth-lifecycle row-family completeness must stay explicit'
  - 'Required lifecycle-stage, memory-strata, differentiation, proof, limit, and collapse families must remain explicit as separate machine-readable row families.'
  - "README root truth-lifecycle completeness discipline must therefore stay\ncongruent with admitted truth-lifecycle-completeness rows rather than becoming\na freehand completeness summary."
  - The machine world must not finalize truth-lifecycle legality while required
    row identity drift remains known only internally.
- rel_path: identity/protocol/README.md
  required_markers:
  - '## Root truth-lifecycle completeness discipline'
  - Truth-lifecycle law is not a soft prose bundle.
  - 'These truth-lifecycle-completeness rules must remain bound to canonical truth-lifecycle-completeness rows rather than drifting into soft summary prose.'
  - '1. required lifecycle-stage, memory-strata, differentiation, proof, limit, and collapse rows must remain explicit as separate machine-readable families;'
- rel_path: identity/protocol/IDENTITY_PROTOCOL.md
  required_markers:
  - '## Root truth-lifecycle completeness boundary'
  - '1. Truth-lifecycle law must remain machine-readable as separate lifecycle-stage, memory-strata, differentiation, proof, limit, and collapse row families.'
  - '6. README root truth-lifecycle completeness discipline rendered at protocol root must remain congruent with admitted truth-lifecycle-completeness rows rather than silently authoring an alternate completeness summary.'
  - '4. Protocol legality must not finalize truth-lifecycle legality while missing or unexpected row identities remain known only inside validator logic.'
- rel_path: identity/protocol/IDENTITY_RUNTIME.md
  required_markers:
  - '## Runtime truth-lifecycle consumption boundary'
  - '1. Runtime consumes truth-lifecycle law as separate lifecycle-stage, memory-strata, differentiation, proof, limit, and collapse row families rather than as undifferentiated lifecycle prose.'
  - '6. Runtime consumes README root truth-lifecycle completeness discipline as a governed completeness projection bound to admitted truth-lifecycle-completeness rows rather than as a freehand completeness summary.'
  - '4. Runtime must not finalize truth-lifecycle legality while missing or unexpected row identities remain known only inside validator machinery.'
required_lifecycle_rows:
- order: 1
  lifecycle_id: truth_exists
  contract_heading: '### 1. Truth exists in protocol law'
  lifecycle_role: truth_exists
- order: 2
  lifecycle_id: truth_discoverable
  contract_heading: '### 2. Truth is discoverable by instance'
  lifecycle_role: truth_discoverable
- order: 3
  lifecycle_id: truth_admissible
  contract_heading: '### 3. Truth is admissible as current-turn authority'
  lifecycle_role: truth_admissible
- order: 4
  lifecycle_id: truth_bound
  contract_heading: '### 4. Truth is bound to current run / current thread'
  lifecycle_role: truth_bound
- order: 5
  lifecycle_id: truth_consumed
  contract_heading: '### 5. Truth is consumed by the next operational step'
  lifecycle_role: truth_consumed
required_memory_strata_rows:
- order: 1
  memory_id: law_memory
  contract_heading: '### 1. Law memory'
  memory_role: law_memory
- order: 2
  memory_id: discovery_memory
  contract_heading: '### 2. Discovery memory'
  memory_role: discovery_memory
- order: 3
  memory_id: admissibility_memory
  contract_heading: '### 3. Admissibility memory'
  memory_role: admissibility_memory
- order: 4
  memory_id: run_binding_memory
  contract_heading: '### 4. Run-binding memory'
  memory_role: run_binding_memory
- order: 5
  memory_id: consumption_memory
  contract_heading: '### 5. Consumption memory'
  memory_role: consumption_memory
required_differentiation_rows:
- order: 1
  differentiation_id: existence_vs_discovery
  contract_phrase: "truth exists in protocol law \u2260 the instance has actually\
    \ discovered it;"
- order: 2
  differentiation_id: discovery_vs_admissibility
  contract_phrase: "the instance discovered it \u2260 it is admissible as current-turn\
    \ authority;"
- order: 3
  differentiation_id: admissibility_vs_binding
  contract_phrase: "it is admissible as current-turn authority \u2260 it is bound\
    \ to the current run / current thread;"
- order: 4
  differentiation_id: binding_vs_consumption
  contract_phrase: "it is bound to the current run / current thread \u2260 the next\
    \ operational step has actually consumed it;"
- order: 5
  differentiation_id: artifact_vs_operational_closure
  contract_phrase: "some artifact or declaration exists \u2260 full operational closure\
    \ has been achieved."
required_truth_lifecycle_proof_rows:
- order: 1
  proof_id: law_existence_proof
  contract_heading: '### 1. Law-existence proof'
  proof_role: law_existence_truth_lifecycle_proof
- order: 2
  proof_id: canonical_discovery_proof
  contract_heading: '### 2. Canonical-discovery proof'
  proof_role: canonical_discovery_truth_lifecycle_proof
- order: 3
  proof_id: current_turn_admissibility_proof
  contract_heading: '### 3. Current-turn-admissibility proof'
  proof_role: current_turn_admissibility_truth_lifecycle_proof
- order: 4
  proof_id: run_thread_binding_proof
  contract_heading: '### 4. Run-thread-binding proof'
  proof_role: run_thread_binding_truth_lifecycle_proof
- order: 5
  proof_id: next_hop_consumption_proof
  contract_heading: '### 5. Next-hop-consumption proof'
  proof_role: next_hop_consumption_truth_lifecycle_proof
required_truth_lifecycle_limit_rows:
- order: 1
  limit_id: law_existence_not_canonical_discovery
  contract_phrase: law-existence proof is not proof of canonical discovery;
- order: 2
  limit_id: canonical_discovery_not_current_turn_admissibility
  contract_phrase: canonical-discovery proof is not proof of current-turn admissibility;
- order: 3
  limit_id: current_turn_admissibility_not_run_thread_binding
  contract_phrase: current-turn-admissibility proof is not proof of run/thread binding;
- order: 4
  limit_id: run_thread_binding_not_next_hop_consumption
  contract_phrase: run-thread-binding proof is not proof of next-hop consumption;
- order: 5
  limit_id: next_hop_consumption_not_lifecycle_bypass
  contract_phrase: next-hop-consumption proof is not proof that lifecycle closure may be claimed when earlier stages were missing or bypassed.
required_collapse_rows:
- order: 1
  collapse_id: existence_equals_discovery
  contract_phrase: shared-law existence is treated as if the instance has already
    discovered the truth.
- order: 2
  collapse_id: discovery_equals_admissibility
  contract_phrase: discovery alone is treated as if current-turn authority has already
    been granted.
- order: 3
  collapse_id: admissibility_equals_binding
  contract_phrase: admissibility is treated as if current-run or current-thread binding
    has already happened.
- order: 4
  collapse_id: binding_equals_consumption
  contract_phrase: bound truth is treated as if the next hop has already consumed
    it.
- order: 5
  collapse_id: artifact_presence_equals_operational_closure
  contract_phrase: the existence of an artifact or declaration is treated as full
    operational closure.
truth_lifecycle_completeness_rows:
- order: 1
  completeness_id: explicit_truth_lifecycle_row_families
  contract_phrase: required lifecycle-stage, memory-strata, differentiation, proof, limit, and collapse rows must remain explicit as separate machine-readable families;
- order: 2
  completeness_id: congruent_truth_lifecycle_row_family_totals
  contract_phrase: expected row-family total and emitted row-family total must remain congruent under machine-readable coverage completeness rather than being left implicit;
- order: 3
  completeness_id: explicit_truth_lifecycle_row_identity_sets
  contract_phrase: expected row identity set and emitted row identity set for each family must also remain machine-readable rather than being collapsed into aggregate counts;
- order: 4
  completeness_id: hidden_truth_lifecycle_identity_drift_forbidden
  contract_phrase: runtime or validator code must not finalize truth-lifecycle legality while missing or unexpected row identities remain known only internally;
- order: 5
  completeness_id: fail_close_preserves_truth_lifecycle_identity_projection
  contract_phrase: fail-close machine output must preserve missing/unexpected row identity projection rather than hiding drift behind row-count shorthand or generic structure failure.
