schema_version: 1
profile_version: v1.6
last_updated_utc: "2026-03-10T09:20:00Z"
default_profile: strict_full

# For strict write/update/release lanes we never allow targeted trimming.
strict_no_trim_operations:
  - activate
  - update
  - mutation
  - readiness
  - e2e
  - ci
  - validate
  - three-plane

profiles:
  strict_full:
    mode: full
    allowed_operations:
      - "*"
    require_work_layers:
      - protocol
      - instance
    operation_requirement_overrides:
      validate:
        exclude_requirement_keys:
          - asb16-rq-017
          - asb16-rq-030
          - asb16-rq-021
          - asb16-rq-022
          - asb16-rq-018
          - asb16-rq-019

  inspection_targeted:
    mode: targeted
    allowed_operations:
      - scan
      - inspection
    require_work_layers:
      - protocol
      - instance
    requirement_keys:
      - asb16-rq-020
      - asb16-rq-033
