schema_version: 1
profile_version: v1.6
last_updated_utc: "2026-03-24T00:00:00Z"
default_profile: strict_full

# For strict write/update/release lanes we never allow targeted trimming.
strict_no_trim_operations:
  - activate
  - update
  - mutation
  - readiness
  - e2e
  - ci
  - validate
  - three-plane

profiles:
  strict_full:
    mode: full
    allowed_operations:
      - "*"
    require_work_layers:
      - protocol
      - instance
    operation_requirement_overrides:
      validate:
        exclude_requirement_keys:
          - asb16-rq-017
          - asb16-rq-030
          - asb16-rq-021
          - asb16-rq-022
          - asb16-rq-018
          - asb16-rq-019
      readiness:
        exclude_requirement_keys:
          - asb16-rq-017
          - asb16-rq-030
          - asb16-rq-021
          - asb16-rq-022
          - asb16-rq-018
          - asb16-rq-019

  three_plane_core:
    mode: targeted
    allowed_operations:
      - three-plane
      - scan
    allow_strict_operations:
      - three-plane
    require_work_layers:
      - protocol
      - instance
    requirement_keys:
      - asb16-rq-001
      - asb16-rq-002
      - asb16-rq-007
      - asb16-rq-008
      - asb16-rq-009
      - asb16-rq-010
      - asb16-rq-011
      - asb16-rq-014
      - asb16-rq-015
      - asb16-rq-023
      - asb16-rq-024
      - asb16-rq-025
      - asb16-rq-026
      - asb16-rq-027
      - asb16-rq-028
      - asb16-rq-031
      - asb16-rq-032
      - asb16-rq-020
      - asb16-rq-033
      - asb16-rq-034
      - asb16-rq-035
      - asb16-rq-036
      - asb16-rq-037
      - asb16-rq-038
      - asb16-rq-039
      - asb16-rq-040
      - asb16-rq-041
      - asb16-rq-055

  inspection_targeted:
    mode: targeted
    allowed_operations:
      - scan
      - inspection
    require_work_layers:
      - protocol
      - instance
    requirement_keys:
      - asb16-rq-020
      - asb16-rq-033
