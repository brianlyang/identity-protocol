schema_version: 1
registry_family: protocol_root_corpus
registry_version: v1
root_dir: identity/protocol
validator_script: scripts/validate_protocol_root_corpus_governance.py
probe_script: scripts/ci/run_protocol_root_corpus_governance_probes_ci.sh
common_script: scripts/root_corpus_governance_common.py
forbidden_content_classes:
  - class_id: workbook_issue_projection
    description: Workbook issue rows or issue-register projection markers must not enter protocol-root law-bearing files.
    patterns:
      - '^###\s+ISSUE-\d+\b'
      - '^\|\s*ISSUE-\d+\b'
      - '^-\s+`status`:\s+[A-Z_]+\s*$'
  - class_id: closure_ledger_narration
    description: Temporal closure chatter and residual-red ledger language must not enter protocol-root law-bearing files.
    patterns:
      - '\bresidual red\b'
      - 'What remains intentionally open:'
      - 'What no longer remains open on this sheet:'
  - class_id: business_domain_example
    description: Business/domain examples must not enter protocol-root law-bearing files.
    patterns:
      - '\bWeChat Shop\b'
      - '\bTaobao\b'
      - '\b1688\b'
      - '\bSKU\b'
      - '\bofferId\b'
      - '\bstore manager\b'
corpus_class_profiles:
  - corpus_class: bottom_theory
    required_markers:
      - '## Document Positioning'
      - '### Boundary relative to streams, releases, and the protocol-root corpus'
      - '## One-line motherline'
      - '### Constitutional derivation order'
  - corpus_class: root_index
    required_markers:
      - '## Root reading order'
      - '## What belongs at protocol root'
      - '## What must not be treated as protocol-root law'
      - '## Root maintenance guardrails'
      - '## Machine-world entry summary'
  - corpus_class: constitution
    required_markers:
      - '## Normative source map (current governed execution)'
      - '## Governance execution stack (how work is controlled)'
      - '## Foundational design philosophy boundary'
      - '## Conflict resolution'
  - corpus_class: runtime_constitution
    required_markers:
      - '## Integration objective'
      - '## Native vs extension boundary'
      - '## Foundational design philosophy anchor'
      - '## Startup sequence'
      - '## Execution guard checks'
  - corpus_class: root_contract
    required_markers:
      - '## Document positioning'
      - '## Root-law scope and non-goals'
      - '## Foundational design philosophy anchor'
      - '## Constitutional inheritance and authority boundary'
      - '## Machine-world audience'
      - '## Runtime adjudication boundary'
registered_top_level_entries:
  - rel_path: identity/protocol/IDENTITY_PROTOCOL_DESIGN_PHILOSOPHY.md
    entry_kind: file
    corpus_class: bottom_theory
    law_bearing: true
    required_markers:
      - '### Three orders must never be collapsed'
      - 'In philosophical order, the identity protocol exists because this bottom theory exists first.'
      - 'root-corpus admission law must be projected into machine-consumed registry and validation surfaces'
    forbidden_content_classes:
      - workbook_issue_projection
      - closure_ledger_narration
      - business_domain_example
  - rel_path: identity/protocol/README.md
    entry_kind: file
    corpus_class: root_index
    law_bearing: true
    required_markers:
      - '## Source-order, reading-order, and adjudication-order'
      - 'root-corpus admission must be machine-governed'
    forbidden_content_classes:
      - workbook_issue_projection
      - closure_ledger_narration
      - business_domain_example
  - rel_path: identity/protocol/IDENTITY_PROTOCOL.md
    entry_kind: file
    corpus_class: constitution
    law_bearing: true
    required_markers:
      - 'This file is therefore a protocol-law constitution derived from that bottom theory'
    forbidden_content_classes:
      - workbook_issue_projection
      - closure_ledger_narration
      - business_domain_example
  - rel_path: identity/protocol/IDENTITY_RUNTIME.md
    entry_kind: file
