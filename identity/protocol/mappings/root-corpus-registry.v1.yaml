schema_version: 1
registry_family: protocol_root_corpus
registry_version: v1
root_dir: identity/protocol
validator_script: scripts/validate_protocol_root_corpus_governance.py
probe_script: scripts/ci/run_protocol_root_corpus_governance_probes_ci.sh
common_script: scripts/root_corpus_governance_common.py
status_key: protocol_root_corpus_governance_status
error_codes:
- IP-RCG-001
- IP-RCG-002
- IP-RCG-003
validator_root_doc_anchor_contract: root_doc_anchor_status_pass_required_with_positive_anchor_check_count
validator_row_projection_contract: nonempty_row_family_projection_rows_with_pass_required_coverage_and_identity_statuses
probe_shadow_bootstrap_contract: probe_shadow_common_contract_rows_pass_required_with_bootstrap_and_mirror_bindings
anchor_checks:
  - rel_path: identity/protocol/IDENTITY_PROTOCOL_DESIGN_PHILOSOPHY.md
    required_markers:
      - '### Governance row-family completeness must stay explicit'
      - Required registered-top-level-entry, corpus-class-profile,
        root-index-class-projection, root-maintenance-guardrail, and
        forbidden-content-class families must remain explicit as separate
        machine-readable row families.
      - README maintenance guardrails about how protocol root is authored and
        kept law-bearing must therefore stay bound to canonical guardrail rows
        rather than remaining reviewer-memory advice.
      - The machine world must not finalize governance legality while required
        rel-path, corpus-class, root-index-class-projection,
        root-maintenance-guardrail, or forbidden-content-class identity drift
        remains known only internally.
  - rel_path: identity/protocol/README.md
    required_markers:
      - '## Root governance completeness discipline'
      - Governance law is not a soft prose bundle.
      - '1. required registered-top-level-entry, corpus-class-profile, root-index-class-projection, root-maintenance-guardrail, and forbidden-content-class rows must remain explicit as separate machine-readable row families;'
  - rel_path: identity/protocol/IDENTITY_PROTOCOL.md
    required_markers:
      - '## Root governance completeness boundary'
      - '1. Governance law must remain machine-readable as separate registered-top-level-entry, corpus-class-profile, root-index-class-projection, root-maintenance-guardrail, and forbidden-content-class row families.'
      - '4. Protocol legality must not finalize governance legality while missing or unexpected rel-path, corpus-class, root-index-class-projection, root-maintenance-guardrail, or forbidden-content-class identities remain known only inside validator logic.'
  - rel_path: identity/protocol/IDENTITY_RUNTIME.md
    required_markers:
      - '## Runtime governance consumption boundary'
      - '1. Runtime consumes governance law as separate registered-top-level-entry, corpus-class-profile, root-index-class-projection, root-maintenance-guardrail, and forbidden-content-class row families rather than as undifferentiated governance prose.'
      - '4. Runtime must not finalize governance legality while missing or unexpected rel-path, corpus-class, root-index-class-projection, root-maintenance-guardrail, or forbidden-content-class identities remain known only inside validator machinery.'
forbidden_content_classes:
  - class_id: workbook_issue_projection
    description: Workbook issue rows or issue-register projection markers must not enter protocol-root law-bearing files.
    patterns:
      - '^###\s+ISSUE-\d+\b'
      - '^\|\s*ISSUE-\d+\b'
      - '^-\s+`status`:\s+[A-Z_]+\s*$'
  - class_id: closure_ledger_narration
    description: Temporal closure chatter and residual-red ledger language must not enter protocol-root law-bearing files.
    patterns:
      - '\bresidual red\b'
      - 'What remains intentionally open:'
      - 'What no longer remains open on this sheet:'
  - class_id: business_domain_example
    description: Business/domain examples must not enter protocol-root law-bearing files.
    patterns:
      - '\bWeChat Shop\b'
      - '\bTaobao\b'
      - '\b1688\b'
      - '\bSKU\b'
      - '\bofferId\b'
      - '\bstore manager\b'
corpus_class_profiles:
  - corpus_class: bottom_theory
    required_markers:
      - '## Document Positioning'
      - '### Boundary relative to streams, releases, and the protocol-root corpus'
      - '## One-line motherline'
      - '### Constitutional derivation order'
  - corpus_class: root_index
    required_markers:
      - '## Root reading order'
      - '## What belongs at protocol root'
      - '## What must not be treated as protocol-root law'
      - '## Root maintenance guardrails'
      - '## Machine-world entry summary'
  - corpus_class: constitution
    required_markers:
      - '## Normative source map (current governed execution)'
      - '## Governance execution stack (how work is controlled)'
      - '## Foundational design philosophy boundary'
      - '## Conflict resolution'
  - corpus_class: runtime_constitution
    required_markers:
      - '## Integration objective'
      - '## Native vs extension boundary'
      - '## Foundational design philosophy anchor'
      - '## Startup sequence'
      - '## Execution guard checks'
  - corpus_class: root_contract
    required_markers:
      - '## Document positioning'
      - '## Root-law scope and non-goals'
      - '## Foundational design philosophy anchor'
      - '## Constitutional inheritance and authority boundary'
      - '## Machine-world audience'
      - '## Runtime adjudication boundary'
root_index_class_projections:
  - order: 1
    projection_label: bottom theory / interpretive source
    bound_corpus_classes:
      - bottom_theory
    required_markers:
      - 'IDENTITY_PROTOCOL_DESIGN_PHILOSOPHY.md'
  - order: 2
    projection_label: constitutions
    bound_corpus_classes:
      - constitution
      - runtime_constitution
    required_markers:
      - 'IDENTITY_PROTOCOL.md'
      - 'IDENTITY_RUNTIME.md'
  - order: 3
    projection_label: root contract law
    bound_corpus_classes:
      - root_contract
    required_markers:
      - machine-law primacy, machine-world ontology, current-truth epistemology,
        decision-evidence admissibility, success-path state admissibility,
        entry-surface legitimacy, error terminality, artifact-family
        admissibility, prompt bootstrap, discovery, handoff, instance
        self-judgement, protocol-instance responsibility, stream-design
        admissibility, truth lifecycle, operator answer surface, and other
        root-domain contracts
  - order: 4
    projection_label: machine-consumed registries and mappings
    bound_corpus_classes:
      - machine_registry_directory
    required_markers:
      - canonical bindings, term registries, stream registries, scope matrices,
        and related SSOT rows
  - order: 5
    projection_label: governed subdomain protocol extensions
    bound_corpus_classes:
      - governed_subdomain_extension
    required_markers:
      - 'broadcast/'
      - 'plugins/'
  - order: 6
    projection_label: clearly demoted support material
    bound_corpus_classes:
      - demoted_support_directory
    required_markers:
      - only when it is explicit that the material is not active-runtime truth
root_maintenance_guardrails:
  - order: 1
    guardrail_label: stream/version is manifestation, not origin
    required_markers:
      - stream or release labels mark governed freeze history;
      - they do not become the philosophical source of protocol existence;
      - no root contract should be written as if a stream label were prior to
        bottom theory.
  - order: 2
    guardrail_label: machine verdict is adjudication, not philosophy source
    required_markers:
      - validators, probes, mappings, runtime state, and receipts determine
        current machine verdict;
      - they do not retroactively define the meaning of design philosophy;
      - philosophy explains why law has the shape it has, while
        machine-consumed surfaces decide current-turn legality.
  - order: 3
    guardrail_label: root contracts must preserve layer clarity
    required_markers:
      - each root contract should state what bottom-theory commitments it
        inherits;
      - each root contract should also state which concrete law it freezes;
      - no root contract should blur philosophical grounding, contract
        freezing, and runtime-source authority into one layer.
  - order: 4
    guardrail_label: root corpus admission must stay law-bearing
    required_markers:
      - the root directory should accept only bottom theory, constitutions, root
        contracts, machine-consumed registries/mappings, governed subdomain
        protocol packs, and clearly demoted support material;
      - stream-local commentary, workbook material, business strategy, or
        workspace residue must not be promoted into protocol-root law-bearing
        position.
  - order: 5
    guardrail_label: root-corpus admission must be machine-governed
    required_markers:
      - law-bearing admission, classification, and exclusion at
        `identity/protocol/` should be mirrored in protocol-owned registry /
        validator / probe surfaces rather than left to reviewer taste or oral
        memory;
      - if root purity depends only on human recollection, the root corpus has
        already started to drift away from machine law.
registered_top_level_entries:
  - rel_path: identity/protocol/IDENTITY_PROTOCOL_DESIGN_PHILOSOPHY.md
    entry_kind: file
    corpus_class: bottom_theory
    law_bearing: true
    required_markers:
      - '### Three orders must never be collapsed'
      - 'In philosophical order, the identity protocol exists because this bottom theory exists first.'
      - 'root-corpus admission law must be projected into machine-consumed registry and validation surfaces'
    forbidden_content_classes:
      - workbook_issue_projection
      - closure_ledger_narration
      - business_domain_example
  - rel_path: identity/protocol/README.md
    entry_kind: file
    corpus_class: root_index
    law_bearing: true
    required_markers:
      - '## Source-order, reading-order, and adjudication-order'
