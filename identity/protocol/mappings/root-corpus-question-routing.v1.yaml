question_routing_anchor_checks:
- rel_path: identity/protocol/README.md
  required_markers:
  - '## Root question-routing discipline'
  - This question-routing discipline must remain bound to canonical root-question-discipline
    stage rows rather than becoming a freehand alternate question ladder.
  - '## Root question-routing completeness discipline'
  - These question-routing-completeness rules must remain bound to canonical
    question-routing-completeness rows rather than drifting into soft summary
    prose.
  - required question-class-profile, root-entry-question-projection, root-question-discipline-stage,
    root-question-discipline-stage-surface, entry-summary-stage, entry-summary-stage-surface,
    and gateway-question-projection rows must remain explicit as separate machine-readable
    row families;
  - runtime or validator code must not finalize question-routing legality while
    missing or unexpected question-class, root-question-discipline-stage, entry-summary-stage,
    or route identities remain known only internally;
  - gateway-mediated refreezing or projection keeps the question class governed
    by the gateway target layer.
  - current-turn legality question must never terminate in philosophy text, README
    text, or frozen contract prose alone.
  - '## Machine-world entry summary'
  - This minimum-correct-path summary must remain bound to canonical entry-summary-stage
    rows rather than becoming oral navigation advice.
  - That is the canonical reading order for this directory.
- rel_path: identity/protocol/IDENTITY_PROTOCOL_DESIGN_PHILOSOPHY.md
  required_markers:
  - '### Question class and answer surface must stay paired'
  - No layer should answer a question that belongs to a different layer.
  - Gateway-mediated refreezing or projection must preserve the question class
    of its governed target layer rather than inheriting a new answer class from
    incoming motivation.
  - README root question-routing discipline must therefore stay congruent with
    admitted root-question-discipline-stage rows rather than becoming a freehand
    alternate question ladder.
  - Required question-class-profile, root-entry-question-projection, root-question-discipline-stage,
    root-question-discipline-stage-surface, entry-summary-stage, entry-summary-stage-surface,
    and gateway-question-projection families must remain explicit as separate
    machine-readable row families.
  - The machine world must not finalize question-routing legality while required
    question-class, root-question-discipline-stage, entry-summary-stage, or route
    identity drift remains known only internally.
  - '### Question-routing row-family completeness must stay explicit'
  - README machine-world entry summary must therefore stay congruent with admitted
    entry-summary-stage rows rather than becoming oral navigation advice.
  - README root question-routing completeness discipline must therefore stay
    congruent with admitted question-routing-completeness rows rather than becoming
    a freehand completeness summary.
- rel_path: identity/protocol/IDENTITY_PROTOCOL.md
  required_markers:
  - '## Root question-routing completeness boundary'
  - Question-routing law must remain machine-readable as separate question-class-profile,
    root-entry-question-projection, root-question-discipline-stage, root-question-discipline-stage-surface,
    entry-summary-stage, entry-summary-stage-surface, and gateway-question-projection
    row families.
  - README root question-routing discipline rendered at protocol root must remain
    congruent with admitted root-question-discipline-stage rows rather than silently
    authoring an alternate question ladder.
  - README machine-world entry summary rendered at protocol root must remain congruent
    with admitted entry-summary-stage rows rather than silently authoring an alternate
    minimum-correct path.
  - README root question-routing completeness discipline rendered at protocol root
    must remain congruent with admitted question-routing-completeness rows rather
    than silently authoring an alternate completeness summary.
- rel_path: identity/protocol/IDENTITY_RUNTIME.md
  required_markers:
  - '## Runtime question-routing consumption boundary'
  - Runtime consumes question-routing law as separate question-class-profile,
    root-entry-question-projection, root-question-discipline-stage, root-question-discipline-stage-surface,
    entry-summary-stage, entry-summary-stage-surface, and gateway-question-projection
    row families rather than as undifferentiated routing prose.
  - Runtime consumes README root question-routing discipline as a governed stage
    projection bound to admitted root-question-discipline-stage rows rather than
    as a freehand alternate question ladder.
  - Runtime consumes README machine-world entry summary as a governed stage projection
    bound to admitted entry-summary-stage rows rather than as oral navigation advice.
  - Runtime consumes README root question-routing completeness discipline as a
    governed completeness projection bound to admitted question-routing-completeness
    rows rather than as a freehand completeness summary.
- rel_path: identity/protocol/MACHINE_LAW_PRIMACY_CONTRACT.md
  required_markers:
  - '## Runtime adjudication boundary'
  - Current-turn machine-law primacy legality must still resolve from machine-consumed
    enforcement surfaces
- rel_path: identity/protocol/MACHINE_WORLD_ONTOLOGY_CONTRACT.md
  required_markers:
  - '## Runtime adjudication boundary'
  - Current-turn machine-world ontology legality must still resolve from machine-consumed
    enforcement surfaces
- rel_path: identity/protocol/CURRENT_TRUTH_EPISTEMOLOGY_CONTRACT.md
  required_markers:
  - '## Runtime adjudication boundary'
  - Current-turn epistemic legality must still resolve from machine-consumed enforcement
