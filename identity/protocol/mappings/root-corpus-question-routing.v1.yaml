root_question_discipline_stages:
- order: 1
  stage_label: generative why-question
  bound_question_classes:
  - generative_why
  bound_corpus_classes:
  - bottom_theory
  required_markers:
  - '`IDENTITY_PROTOCOL_DESIGN_PHILOSOPHY.md`'
  - why identity protocol law exists in this shape at all.
- order: 2
  stage_label: root-entry question
  bound_question_classes:
  - root_entry_navigation
  bound_corpus_classes:
  - root_index
  required_markers:
  - '`README.md`'
  - how to enter the root corpus without semantic confusion.
- order: 3
  stage_label: constitutional law question
  bound_question_classes:
  - frozen_protocol_law
  - frozen_runtime_law
  bound_corpus_classes:
  - constitution
  - runtime_constitution
  required_markers:
  - '`IDENTITY_PROTOCOL.md`'
  - '`IDENTITY_RUNTIME.md`'
  - what protocol-law and runtime-law are concretely frozen.
- order: 4
  stage_label: domain-law question
  bound_question_classes:
  - frozen_domain_contract_law
  bound_corpus_classes:
  - root_contract
  required_markers:
  - root contract files.
  - what concrete root-domain contract law is frozen.
- order: 5
  stage_label: machine-registry question
  bound_question_classes:
  - registry_resolution
  bound_corpus_classes:
  - machine_registry_directory
  required_markers:
  - '`mappings/`'
  - which aliases, active files, bindings, and registry rows are machine-consumed
    truth.
- order: 6
  stage_label: governed extension question
  bound_question_classes:
  - governed_extension_law
  bound_corpus_classes:
  - governed_subdomain_extension
  required_markers:
  - '`broadcast/`'
  - '`plugins/`'
  - what narrower subdomain law is frozen under the root corpus.
- order: 7
  stage_label: support-material question
  bound_question_classes:
  - support_material_lookup
  bound_corpus_classes:
  - demoted_support_directory
  required_markers:
  - '`fixtures/`'
  - what demoted support material exists without becoming runtime truth.
- order: 8
  stage_label: gateway target question class preserved
  bound_question_classes:
  - frozen_protocol_law
  - frozen_runtime_law
  - frozen_domain_contract_law
  - registry_resolution
  bound_gateway_classes:
  - constitution
  - runtime_constitution
  - root_contract
  - machine_registry_directory
  required_markers:
  - gateway-mediated refreezing or projection keeps the question class governed
    by the gateway target layer.
  - it does not inherit a new answer class from incoming motivation or local
    convenience.
entry_summary_stages:
- order: 1
  stage_label: bottom theory first
  bound_question_classes:
  - generative_why
  required_markers:
  - read `IDENTITY_PROTOCOL_DESIGN_PHILOSOPHY.md` to understand the bottom theory.
- order: 2
  stage_label: constitutions next
  bound_question_classes:
  - frozen_protocol_law
  - frozen_runtime_law
  required_markers:
  - read `IDENTITY_PROTOCOL.md` and `IDENTITY_RUNTIME.md` to understand protocol
    and runtime constitutions.
- order: 3
  stage_label: relevant root contract after that
  bound_question_classes:
  - frozen_domain_contract_law
  required_markers:
  - read the relevant root contract file for the concrete domain being executed.
- order: 4
  stage_label: machine-consumed verdict surfaces last
  bound_question_classes:
  - current_turn_legality
  terminal_machine_surfaces:
  - mappings
  - validators
  - probes
  - runtime_state
  - receipts
  required_markers:
  - read mappings, validators, probes, runtime state, and receipts for the final
    machine-consumed verdict.
question_routing_completeness_rows:
- order: 1
  completeness_id: explicit_question_routing_row_families
  contract_phrase: required question-class-profile, root-entry-question-projection,
    root-question-discipline-stage, root-question-discipline-stage-surface, entry-summary-stage,
    entry-summary-stage-surface, and gateway-question-projection rows must remain
    explicit as separate machine-readable row families;
- order: 2
  completeness_id: congruent_question_routing_row_family_totals
  contract_phrase: expected row-family total and emitted row-family total must
    remain congruent under machine-readable coverage completeness rather than being
    left implicit;
- order: 3
  completeness_id: explicit_question_routing_row_identity_sets
  contract_phrase: expected row identity set and emitted row identity set for
    each family must also remain machine-readable rather than being collapsed into
    aggregate counts;
- order: 4
  completeness_id: hidden_question_routing_identity_drift_forbidden
  contract_phrase: runtime or validator code must not finalize question-routing
    legality while missing or unexpected question-class, root-question-discipline-stage,
    entry-summary-stage, or route identities remain known only internally;
- order: 5
  completeness_id: fail_close_preserves_question_routing_identity_projection
  contract_phrase: fail-close machine output must preserve missing/unexpected row
    identity projection rather than hiding drift behind row-count shorthand or
    generic structure failure.
