question_routing_anchor_checks:
- rel_path: identity/protocol/README.md
  required_markers:
  - '## Root question-routing discipline'
  - current-turn legality question must never terminate in philosophy text, README
    text, or frozen contract prose alone.
  - 'gateway-mediated refreezing or projection keeps the question class governed by the gateway target layer:'
- rel_path: identity/protocol/IDENTITY_PROTOCOL_DESIGN_PHILOSOPHY.md
  required_markers:
  - '### Question class and answer surface must stay paired'
  - No layer should answer a question that belongs to a different layer.
  - Gateway-mediated refreezing or projection must preserve the question class
    of its governed target layer rather than inheriting a new answer class from
    incoming motivation.
- rel_path: identity/protocol/MACHINE_LAW_PRIMACY_CONTRACT.md
  required_markers:
  - '## Runtime adjudication boundary'
  - Current-turn machine-law primacy legality must still resolve from machine-consumed
    enforcement surfaces
- rel_path: identity/protocol/MACHINE_WORLD_ONTOLOGY_CONTRACT.md
