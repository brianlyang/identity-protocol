ordering_anchor_checks:
- rel_path: identity/protocol/README.md
  required_markers:
  - '## Root ordering completeness discipline'
  - These ordering-completeness rules must remain bound to canonical ordering-completeness
    rows rather than drifting into soft summary prose.
  - required source-order, reading-order, root-reading-order-stage, root-reading-order-stage-surface,
    order-plane-stage, order-plane-stage-surface, explanatory root-contract index/projection,
    adjudication-order, and adjudication-surface-profile rows must remain explicit
    as separate machine-readable row families;
  - runtime or validator code must not finalize ordering legality while missing
    or unexpected source, entry, root-reading-order-stage, order-plane-stage,
    manual-root-contract, or adjudication-surface identities remain known only
    internally;
  - These order distinctions must remain bound to canonical order-plane stage
    rows rather than becoming a freehand semantic triad.
  - This root reading order must remain bound to canonical root-reading-order
    stage rows rather than becoming a freehand alternate entry ladder.
  - '## Root adjudication-surface discipline'
  - mappings admit applicable machine law and registry truth for current-turn legality;
  - validators test legality against that admitted law rather than inventing new
    origin law;
  - probes negate drift by fail-closing weakened or hidden legality assumptions;
  - runtime state binds live current-turn truth only after prior legality phases
    have remained lawful;
  - receipts close the adjudicated verdict and must not back-author earlier legality
    phases.
  - this manual root-contract index is explanatory only and must remain congruent
    with the admitted `reading_order` root-contract sequence rather than becoming
    an independently authored alternate order.
- rel_path: identity/protocol/IDENTITY_PROTOCOL_DESIGN_PHILOSOPHY.md
  required_markers:
  - '### Ordering row-family completeness must stay explicit'
  - README root ordering-completeness discipline must therefore stay congruent
    with admitted ordering-completeness rows rather than becoming a freehand
    completeness summary.
  - README root reading order must therefore stay congruent with admitted root-reading-order-stage
    rows rather than becoming a freehand alternate entry ladder.
  - README source-order / reading-order / adjudication-order distinctions must
    therefore stay congruent with admitted order-plane-stage rows rather than
    becoming a freehand semantic triad.
  - '### Adjudication surfaces are phase-governed, not interchangeable'
  - mappings admit applicable law into the current-turn legality path;
  - validators evaluate legality against admitted law rather than inventing new
    origin law;
  - probes negate hidden drift by fail-closing weakened legality assumptions;
  - runtime state binds live present-turn truth only after the earlier legality
    phases remain lawful;
  - receipts close the adjudicated verdict rather than back-authoring the earlier
    legality phases they summarize.
- rel_path: identity/protocol/IDENTITY_PROTOCOL.md
  required_markers:
  - '## Root ordering completeness boundary'
  - README root ordering completeness discipline rendered at protocol root must
    remain congruent with admitted ordering-completeness rows rather than silently
    authoring an alternate completeness summary.
  - README root reading order stages rendered at protocol root must remain congruent
    with admitted root-reading-order-stage rows rather than silently authoring
    an alternate entry ladder.
  - README source-order / reading-order / adjudication-order distinctions rendered
    at protocol root must remain congruent with admitted order-plane-stage rows
    rather than silently authoring an alternate semantic triad.
  - '## Root adjudication-surface boundary'
  - mappings admit machine-consumed law and registry truth into current-turn legality;
  - validators evaluate legality against that admitted law rather than authoring
    new source law;
  - probes fail-close hidden drift instead of softening legality expectations;
  - runtime state binds live truth only after prior legality phases remain satisfied;
  - receipts close the adjudicated verdict and do not replace the earlier legality
    phases they report.
  - The manual root-contract enumeration carried by this constitution is an explanatory
    projection and must remain congruent with the admitted `reading_order` root-contract
    sequence and admitted root-contract projection labels rather than becoming
    an independently authored alternate root index or relabeling domain law.
- rel_path: identity/protocol/IDENTITY_RUNTIME.md
  required_markers:
  - '## Runtime ordering consumption boundary'
  - Runtime consumes README root ordering completeness discipline as a governed
    completeness projection bound to admitted ordering-completeness rows rather
    than as a freehand completeness summary.
  - Runtime consumes README root reading order as a governed stage projection
    bound to admitted root-reading-order-stage rows rather than as a freehand
    alternate entry ladder.
  - Runtime consumes README source-order / reading-order / adjudication-order
    distinctions as a governed stage projection bound to admitted order-plane-stage
    rows rather than as a freehand semantic triad.
  - '## Runtime adjudication-surface consumption boundary'
  - Runtime consumes mappings as admissible law-resolution surfaces rather than
    as optional lookup hints.
  - Runtime consumes validators as legality-evaluation surfaces rather than as
    replaceable commentary.
  - Runtime consumes probes as fail-close drift-negation surfaces rather than
    soft diagnostics.
  - Runtime consumes runtime state as live-truth binding only after prior legality
    phases remain satisfied.
  - Runtime consumes receipts as adjudicated verdict closure rather than as upstream
    law-authoring surfaces.
