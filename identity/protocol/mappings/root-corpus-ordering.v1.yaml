- order: 2
  stage_label: root reading-order
  bound_row_families:
  - root_reading_order_stages
  - root_reading_order_stage_surface
  required_markers:
  - the entry sequence defined at the top of this file
  - the README entry ladder must remain congruent with admitted root-reading-order
    stage rows rather than becoming a freehand alternate order
  - 'answers: how to enter the root corpus without semantic confusion.'
- order: 3
  stage_label: adjudication-order
  bound_row_families:
  - adjudication_order
  - adjudication_surface_profiles
  required_markers:
  - governance/review docs, mappings, validators, probes, runtime state, and
