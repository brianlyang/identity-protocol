schema_version: 1
version: v1.6
description: >
  Single-source stream document registry for v1.6.x governance/review lanes.
  Validators must consume this file instead of hardcoding stream doc paths.

stream_docs:
  - stream_version: v1.6.1
    governance_doc: docs/governance/identity-headstamp-egress-governance-v1.6.1.md
    review_doc: docs/review/protocol-remediation-audit-ledger-v1.6.1-headstamp.md
