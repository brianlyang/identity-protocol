- rel_path: identity/protocol/IDENTITY_PROTOCOL.md
  required_markers:
  - '## Root machine-registry completeness boundary'
  - Machine-registry completeness must also keep admitted family and emitted
    status disclosure explicit as separate row families
  - Law-bearing root mapping families under `identity/protocol/mappings/` become canonical
    only when admitted by the machine-registry directory child set.
  - On-disk presence without registry admission does not authorize current-turn consumption,
    legal ingress, or bundle membership.
  - Registry-completeness drift is a root-law failure, not a convenience-layer warning.
  - 5. Registry admission without discoverable validator/probe/common/status-key/error-code
    surfaces is
    still incomplete.
  - 6. Repo-relative descriptor surfaces disclosed by an admitted family must remain
    repo-root relative and repo-contained; absolute-path or parent-escape capture
    is non-compliant.
  - 7. Repo-relative descriptor surfaces disclosed by an admitted family must also
    stay role-typed; validator, probe, and shared-common path classes are not
    interchangeable.
  - 8. Role-typed repo-relative descriptor surfaces disclosed by an admitted family
    must also stay cross-role coherent; validator/probe/common may not silently
    bind to different root surface stems.
  - 9. Cross-role coherent descriptor surfaces disclosed by an admitted family must
    also stay family-congruent; borrowing another family's descriptor stem requires
    explicit registry-completeness declaration rather than silent impersonation.
- rel_path: identity/protocol/IDENTITY_RUNTIME.md
  required_markers:
  - '## Runtime registry-completeness boundary'
  - Runtime must also keep admitted family and emitted status disclosure
    explicit during machine-registry validation
  - Runtime may consume only root mapping families admitted by governed machine-registry
    completeness law.
  - A root mapping file present on disk but absent from the admitted child set is
    non-canonical for runtime legality.
  - Runtime must fail-close on registry-completeness drift rather than loading the
    most convenient on-disk mapping.
  - 5. Runtime must discover validator/probe/common/status-key/error-code surfaces
    from admitted mapping-family descriptors rather than hidden local knowledge.
  - 6. Runtime must reject descriptor paths that are absolute or escape repo root;
    repo-relative descriptor surfaces must stay repo-root relative and repo-contained.
  - 7. Runtime must also reject role-swapped descriptor paths; validator, probe,
    and shared-common surfaces must stay role-typed rather than merely repo-local.
  - 8. Runtime must also reject cross-role incoherent descriptor sets;
    validator/probe/common surfaces for one admitted family must converge on one
    root surface stem.
  - 9. Runtime must also reject undeclared family-incongruent descriptor sets;
    even a coherent validator/probe/common set is non-canonical unless any
    cross-family stem binding is explicitly declared by registry completeness law.
