required_descriptor_fields:
- validator_script
- probe_script
- common_script
- status_key
- error_codes
required_descriptor_field_modes:
  validator_script: repo_rel_path
  probe_script: repo_rel_path
  common_script: repo_rel_path
  status_key: validator_status_key
  error_codes: validator_error_code_list
required_repo_rel_path_patterns:
  validator_script: ^scripts/validate_protocol_(?P<surface_stem>root_[a-z0-9_]+)\.py$
  probe_script: ^scripts/ci/run_protocol_(?P<surface_stem>root_[a-z0-9_]+)_probes_ci\.sh$
  common_script: ^scripts/(?P<surface_stem>root_[a-z0-9_]+)_common\.py$
