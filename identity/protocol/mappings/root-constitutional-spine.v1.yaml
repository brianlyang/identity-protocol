error_codes:
- IP-RCS-001
- IP-RCS-002
- IP-RCS-003
validator_root_doc_anchor_contract: root_doc_anchor_status_pass_required_with_positive_anchor_check_count
validator_row_projection_contract: nonempty_row_family_projection_rows_with_pass_required_coverage_and_identity_statuses
probe_shadow_bootstrap_contract: probe_shadow_common_contract_rows_pass_required_with_bootstrap_and_mirror_bindings
anchor_checks:
  - rel_path: identity/protocol/IDENTITY_PROTOCOL_DESIGN_PHILOSOPHY.md
    required_markers:
      - '### Philosophy-first discipline must stay explicit'
      - README philosophy-first rules about why protocol law exists must
        therefore stay bound to canonical philosophy-primacy rows rather than
        remaining motivational prose.
      - '### Constitutional spine row-family completeness must stay explicit'
      - Constitutional-entry rows and spine-bridge rows must remain explicit as
        separate machine-law families.
      - README root constitutional-spine completeness discipline must therefore
        stay congruent with admitted constitutional-spine-completeness rows
        rather than becoming a freehand completeness summary.
      - The machine world must not finalize constitutional-spine truth while
        missing or unexpected entry rel-paths or bridge ids remain known only
        inside validator logic.
  - rel_path: identity/protocol/README.md
    required_markers:
      - '## Why philosophy comes first'
      - These philosophy-first rules must remain bound to canonical
        philosophy-primacy rows rather than drifting into motivational prose.
      - '## Root constitutional-spine discipline'
      - Constitutional-entry rows and spine-bridge rows must remain explicit as
        separate machine-governed families.
      - '## Root constitutional-spine completeness discipline'
      - These constitutional-spine-completeness rules must remain bound to
        canonical constitutional-spine-completeness rows rather than drifting
        into soft summary prose.
      - Validator or runtime code must not finalize constitutional-spine truth
        while missing or unexpected entry rel-paths or bridge ids remain known
        only inside local machinery.
  - rel_path: identity/protocol/IDENTITY_PROTOCOL.md
    required_markers:
      - Protocol consumes philosophy-first law as explicit philosophy-primacy
        rows and spine-bridge rows rather than as motivational context alone.
      - '## Root constitutional-spine boundary'
      - '1. The root constitutional spine is governed as separate constitutional-entry and spine-bridge row families rather than as one narrative claim.'
      - '## Root constitutional-spine completeness boundary'
      - '6. README root constitutional-spine completeness discipline rendered at protocol root must remain congruent with admitted constitutional-spine-completeness rows rather than silently authoring an alternate completeness summary.'
      - '6. Protocol legality must not finalize constitutional-spine truth while missing or unexpected entry rel-paths or bridge ids remain known only inside validator machinery.'
  - rel_path: identity/protocol/IDENTITY_RUNTIME.md
    required_markers:
      - Runtime consumes philosophy-first law as explicit philosophy-primacy
        rows and spine-bridge rows rather than as motivational context alone.
      - '## Runtime constitutional-spine consumption boundary'
      - '1. Runtime consumes constitutional spine law as separate constitutional-entry and spine-bridge row families rather than as undifferentiated narrative context.'
      - '## Runtime constitutional-spine completeness consumption boundary'
      - '6. Runtime consumes README root constitutional-spine completeness discipline as a governed completeness projection bound to admitted constitutional-spine-completeness rows rather than as a freehand completeness summary.'
      - '4. Runtime must not finalize constitutional-spine legality while missing or unexpected entry rel-paths or bridge ids remain known only inside validator machinery.'
registry_current_file: identity/protocol/mappings/root-corpus-registry.current.yaml
