- IP-RCT-003
validator_root_doc_anchor_contract: root_doc_anchor_status_pass_required_with_positive_anchor_check_count
validator_row_projection_contract: nonempty_row_family_projection_rows_with_pass_required_coverage_and_identity_statuses
probe_shadow_bootstrap_contract: probe_shadow_common_contract_rows_pass_required_with_bootstrap_and_mirror_bindings
transition_anchor_checks:
- rel_path: identity/protocol/README.md
  required_markers:
  - '## Root promotion-demotion discipline'
  - outer governance, review, workbook, reference, evidence, runtime, receipt, and
    implementation surfaces may motivate strengthening, but they do not directly promote
    themselves into root law;
  - demoted support material cannot directly climb back into law-bearing root status;
- rel_path: identity/protocol/IDENTITY_PROTOCOL_DESIGN_PHILOSOPHY.md
  required_markers:
  - '### Promotion, demotion, and re-entry must stay governed'
  - demotion removes law-bearing authority; it does not preserve a suspended sovereignty
    that can silently reclaim root status later;
  - outer governance, review, workbook, reference, evidence, runtime, receipt, and
    implementation surfaces may motivate strengthening, but they do not directly author
    root law by themselves;
- rel_path: identity/protocol/IDENTITY_PROTOCOL.md
  required_markers:
  - '## Root-law promotion and re-entry boundary'
  - Promotion into root law without governed refreezing is non-compliant, even if
    the motivating surface contains true evidence.
- rel_path: identity/protocol/IDENTITY_RUNTIME.md
  required_markers:
  - '## Runtime-to-root promotion boundary'
  - Runtime-origin evidence must re-enter shared law only through governed refreezing
    at constitutional, runtime-constitutional, root-contract, or machine-registry
    gateways.
