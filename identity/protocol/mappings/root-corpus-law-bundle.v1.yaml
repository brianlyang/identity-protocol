schema_version: 1
law_bundle_family: protocol_root_corpus_law_bundle
law_bundle_version: v1
root_dir: identity/protocol
validator_script: scripts/validate_protocol_root_corpus_law_bundle.py
probe_script: scripts/ci/run_protocol_root_corpus_law_bundle_probes_ci.sh
common_script: scripts/root_corpus_law_bundle_common.py
status_key: protocol_root_corpus_law_bundle_status
error_codes:
- IP-RCLB-001
- IP-RCLB-002
- IP-RCLB-003
require_component_descriptor_concordance: true
required_component_descriptor_fields:
- validator_script
- probe_script
- common_script
- status_key
bundle_anchor_checks:
- rel_path: identity/protocol/IDENTITY_PROTOCOL_DESIGN_PHILOSOPHY.md
  required_markers:
  - '### Root-law bundle must stay explicit and jointly governed'
  - Constitutional spine, root admission/governance, source-order, authority,
  - machine-registry completeness, and conflict precedence are not optional
  - Weakening one slice while keeping the others green is a root-law coherence
  - That joint governance also requires descriptor concordance across the bundle.
  - status-key surfaces, the machine world is being asked to trust shadow bundle
  - knowledge instead of the admitted family descriptor.
- rel_path: identity/protocol/README.md
  required_markers:
  - '## Root-law bundle discipline'
  - Constitutional spine, root admission/governance, source-order, authority
  - gateway-admissibility, machine-registry completeness, and conflict precedence
  - No single slice is sufficient by itself; the machine world must preserve them
    as one governed root-law bundle.
  - Bundle membership must also remain descriptor-concordant with the admitted
    component families it binds.
  - A bundle row may not silently drift from a component family's own disclosed
    validator, probe, shared-common, or emitted status-key surfaces.
- rel_path: identity/protocol/IDENTITY_PROTOCOL.md
  required_markers:
  - '## Root-law bundle boundary'
  - 1. constitutional spine;
  - 9. machine-registry completeness;
  - Strengthening one slice must not silently weaken or bypass another; any
  - Root-law bundle rows must also remain descriptor-concordant with the active
  - component family's own disclosed validator/probe/common/status-key surfaces.
- rel_path: identity/protocol/IDENTITY_RUNTIME.md
  required_markers:
  - '## Runtime consumption of the root-law bundle'
  - constitutional spine, admission/governance, ordering, authority, question-routing,
  - machine-registry completeness,
  - Runtime must not select the most convenient slice in isolation.
  - Runtime must also reject a root-law bundle row whose validator/probe/common/status-key
  - surfaces drift from the active component descriptor it claims to bind.
