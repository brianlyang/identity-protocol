    required_markers:
      - '### Root-law bundle must stay explicit and jointly governed'
      - 'Constitutional spine, root admission/governance, source-order, authority, question-routing, derivation, transition, gateway-admissibility, and conflict precedence are not'
      - 'Weakening one slice while keeping the others green is a root-law coherence'
