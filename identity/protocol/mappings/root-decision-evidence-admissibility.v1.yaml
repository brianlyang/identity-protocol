required_collapse_rows:
  - order: 1
    collapse_id: motivation_surface_as_terminal_evidence
    contract_phrase: 'motivating or contextual material is treated as if it were terminal decision evidence.'
  - order: 2
    collapse_id: latest_visible_receipt_as_admissible_evidence
    contract_phrase: 'the latest visible receipt is treated as if it were automatically bound admissible evidence.'
  - order: 3
    collapse_id: runtime_residue_as_shared_law_evidence
    contract_phrase: 'runtime residue is treated as if it rewrote shared law or constitutional authority.'
  - order: 4
    collapse_id: summary_projection_as_source_evidence
    contract_phrase: 'summary, projection, or commentary is treated as if it were source evidence.'
  - order: 5
    collapse_id: sample_fixture_diagnostic_as_live_decision_evidence
    contract_phrase: 'sample, fixture, diagnostics, migration, or replay material is treated as if it were active success-path evidence.'
  - order: 6
    collapse_id: receipt_closure_as_upstream_legality_evidence
    contract_phrase: 'receipt closure is treated as if it authored or replaced earlier legality phases.'
  - order: 7
    collapse_id: prose_payload_as_machine_decision_evidence
    contract_phrase: 'handoff prose or operator-facing narration is treated as if it were machine decision evidence.'
  - order: 8
    collapse_id: decision_evidence_class_proof_flattening
    contract_phrase: 'frozen-law, registry, validator-verdict, bound-runtime, adjudicated-closure, and demoted-support evidence classes are treated as if one decision-evidence proof stratum were sufficient for all of them.'
decision_evidence_admissibility_completeness_rows:
  - order: 1
    completeness_id: explicit_decision_evidence_admissibility_row_families
    contract_phrase: 'required evidence-class, differentiation, adjudication-phase-alignment, decision-evidence-proof, evidence-class-proof-alignment, limit, and collapse rows must remain explicit as separate machine-readable families;'
  - order: 2
    completeness_id: congruent_decision_evidence_admissibility_row_family_totals
    contract_phrase: 'expected row-family total and emitted row-family total must remain congruent under machine-readable coverage completeness rather than being left implicit;'
  - order: 3
    completeness_id: explicit_decision_evidence_admissibility_row_identity_sets
    contract_phrase: 'expected row identity set and emitted row identity set for each family must also remain machine-readable rather than being collapsed into aggregate counts;'
  - order: 4
    completeness_id: hidden_decision_evidence_admissibility_identity_drift_forbidden
    contract_phrase: 'runtime or validator code must not finalize decision-evidence admissibility while missing or unexpected row identities remain known only internally;'
  - order: 5
    completeness_id: fail_close_preserves_decision_evidence_admissibility_identity_projection
    contract_phrase: 'fail-close machine output must preserve missing/unexpected row identity projection rather than hiding drift behind row-count shorthand or generic structure failure.'
