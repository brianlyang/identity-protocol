schema_version: 1
version: v1.6
control_plane_contract: minor_family_workbook_control_plane
description: >
  Canonical workbook registry for cross-stream issue governance inside
  identity-protocol-local.

template_contract:
  contract_id: minor_family_workbook_template_v1
  template_dir: docs/workbook/templates
  templates_readme: docs/workbook/templates/README.md
  issue_register_template: docs/workbook/templates/protocol-issue-register.template.md
  deep_audit_template: docs/workbook/templates/protocol-deep-audit-workbook.template.md
  scaffold_script: scripts/scaffold_workbook_family.py
  contract_validator: scripts/validate_workbook_family_contract.py
  projection_renderer: scripts/render_active_workbook_projections.py
  scaffold_projection_root: activity/evidence/workbook-projections
  projection_policy: optional_workspace_projection_exports
  projection_presence_policy: optional_projection
  projection_freshness_mode: boundary_markers_only
  current_pointer_activation_mode: explicit_current_pointer_switch_only
  current_pointer_activation_consent_token: workbook_current_pointer_switch_v1
  governance_doc: docs/governance/identity-workbook-governance-v1.6.md
  workbook_registry_current_ref: identity/protocol/mappings/workbook-registry.current.yaml
  stream_doc_registry_ref: identity/protocol/mappings/stream-doc-registry.current.yaml
  control_plane_status_ref: identity/protocol/mappings/control-plane-status.current.yaml

active_workbook_family:
  workbook_family: v1.6
  minor_family_uniqueness_mode: exact_canonical_pair_only
  authority_surfaces:
    issue_register_doc: docs/workbook/protocol-issue-register-v1.6.md
    deep_audit_workbook_doc: docs/workbook/protocol-deep-audit-workbook-v1.6.md
  issue_register_doc: docs/workbook/protocol-issue-register-v1.6.md
  deep_audit_workbook_doc: docs/workbook/protocol-deep-audit-workbook-v1.6.md
  governance_doc: docs/governance/identity-workbook-governance-v1.6.md
  projection_policy: optional_workspace_projection_exports
  projection_exports:
    - projection_role: issue_register_projection
      path: activity/evidence/workbook-projections/v1.6/protocol-issue-register-v1.6.projection.md
      authority_doc: docs/workbook/protocol-issue-register-v1.6.md
      presence_policy: optional_projection
      freshness_mode: boundary_markers_only
    - projection_role: deep_audit_projection
      path: activity/evidence/workbook-projections/v1.6/protocol-deep-audit-workbook-v1.6.projection.md
      authority_doc: docs/workbook/protocol-deep-audit-workbook-v1.6.md
      presence_policy: optional_projection
      freshness_mode: boundary_markers_only
  authority_model: minor_family_issue_register_authoritative_with_optional_workspace_projections
  stream_version_mode: workbook_minor_governs_stream_patch_lanes
