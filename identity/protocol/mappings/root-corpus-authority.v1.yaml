authority_anchor_checks:
- rel_path: identity/protocol/README.md
  required_markers:
  - '## Authority layering'
  - This authority layering must remain bound to canonical authority-layer stage
    rows rather than becoming a freehand alternate authority ladder.
  - machine-consumed enforcement authority
  - Philosophical primacy, however, is not the same as runtime-source primacy.
- rel_path: identity/protocol/IDENTITY_PROTOCOL_DESIGN_PHILOSOPHY.md
  required_markers:
  - philosophical primacy does not mean runtime-source primacy
  - machine-consumed authority still lives in frozen contracts, mappings, validators,
    runtime state, and receipts
  - README authority layering must therefore stay congruent with admitted authority-layer-stage
    rows rather than becoming a freehand alternate authority ladder.
- rel_path: identity/protocol/IDENTITY_PROTOCOL.md
  required_markers:
  - '## Root authority completeness boundary'
  - README authority layering stages rendered at protocol root must remain congruent
    with admitted authority-layer-stage rows rather than silently authoring an
    alternate authority ladder.
- rel_path: identity/protocol/IDENTITY_RUNTIME.md
  required_markers:
  - '## Runtime authority consumption boundary'
  - Runtime consumes README authority layering as a governed stage projection
    bound to admitted authority-layer-stage rows rather than as a freehand alternate
    authority ladder.
- rel_path: identity/protocol/MACHINE_LAW_PRIMACY_CONTRACT.md
  required_markers:
  - '## Runtime adjudication boundary'
  - Current-turn machine-law primacy legality must still resolve from machine-consumed
    enforcement surfaces
