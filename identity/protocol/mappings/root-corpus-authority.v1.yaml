authority_layer_stages:
- order: 1
  stage_label: bottom-theory primacy
  bound_corpus_classes:
  - bottom_theory
  bound_authority_roles:
  - interpretive_bottom_theory
  bound_machine_surfaces: []
  required_markers:
  - '`IDENTITY_PROTOCOL_DESIGN_PHILOSOPHY.md`'
  - explains *why* protocol law has the shape it has.
- order: 2
  stage_label: constitutional / contract authority
  bound_corpus_classes:
  - constitution
  - runtime_constitution
  - root_contract
  bound_authority_roles:
  - constitutional_protocol_law
  - constitutional_runtime_law
  - root_domain_contract_law
  bound_machine_surfaces: []
  required_markers:
  - '`IDENTITY_PROTOCOL.md`'
  - '`IDENTITY_RUNTIME.md`'
  - root contract files such as machine-law primacy, machine-world ontology, current-truth
    epistemology, decision-evidence admissibility, success-path state admissibility,
    entry-surface legitimacy, error terminality, artifact-family admissibility,
    prompt bootstrap, discovery, handoff, instance self-judgement, protocol-instance
    responsibility, stream-design admissibility, truth-lifecycle, and operator
    answer-surface contracts
  - these define *what law is concretely frozen*.
- order: 3
  stage_label: machine-consumed enforcement authority
  bound_corpus_classes:
  - machine_registry_directory
  bound_authority_roles:
  - machine_consumed_registry_family
  bound_machine_surfaces:
  - governance_review_docs
  - mappings
  - validators
  - probes
  - runtime_state
  - receipts
  required_markers:
  - governance/review docs
  - mappings
  - validators
  - probes
  - runtime state
  - receipts
  - these determine *current machine truth and pass/fail authority*.
