authority_anchor_checks:
- rel_path: identity/protocol/README.md
  required_markers:
  - '## Authority layering'
  - This authority layering must remain bound to canonical authority-layer stage
    rows rather than becoming a freehand alternate authority ladder.
  - '## Root authority completeness discipline'
  - These authority-completeness rules must remain bound to canonical authority-completeness
    rows rather than drifting into soft summary prose.
  - '1. required authority-class-profile, entry-authority-projection, authority-layer-stage,
    and authority-layer-stage-surface rows must remain explicit as separate machine-readable
    row families;'
  - machine-consumed enforcement authority
  - Philosophical primacy, however, is not the same as runtime-source primacy.
- rel_path: identity/protocol/IDENTITY_PROTOCOL_DESIGN_PHILOSOPHY.md
  required_markers:
  - '### Authority row-family completeness must stay explicit'
  - philosophical primacy does not mean runtime-source primacy
  - machine-consumed authority still lives in frozen contracts, mappings, validators,
    runtime state, and receipts
  - README root authority completeness discipline must therefore stay congruent
    with admitted authority-completeness rows rather than becoming a freehand
    completeness summary.
  - README authority layering must therefore stay congruent with admitted authority-layer-stage
    rows rather than becoming a freehand alternate authority ladder.
- rel_path: identity/protocol/IDENTITY_PROTOCOL.md
  required_markers:
  - '## Root authority completeness boundary'
  - '1. Authority law must remain machine-readable as separate authority-class-profile,
    entry-authority-projection, authority-layer-stage, and authority-layer-stage-surface
    row families.'
  - README root authority completeness discipline rendered at protocol root must
    remain congruent with admitted authority-completeness rows rather than silently
    authoring an alternate completeness summary.
  - '7. README authority layering stages rendered at protocol root must remain congruent
    with admitted authority-layer-stage rows rather than silently authoring an
    alternate authority ladder.'
  - README authority layering stages rendered at protocol root must remain congruent
    with admitted authority-layer-stage rows rather than silently authoring an
    alternate authority ladder.
- rel_path: identity/protocol/IDENTITY_RUNTIME.md
  required_markers:
  - '## Runtime authority consumption boundary'
  - '1. Runtime consumes authority law as separate authority-class-profile, entry-authority-projection,
    authority-layer-stage, and authority-layer-stage-surface row families rather
    than as undifferentiated authority prose.'
  - Runtime consumes README root authority completeness discipline as a governed
    completeness projection bound to admitted authority-completeness rows rather
    than as a freehand completeness summary.
  - '7. Runtime consumes README authority layering as a governed stage projection
    bound to admitted authority-layer-stage rows rather than as a freehand alternate
    authority ladder.'
  - Runtime consumes README authority layering as a governed stage projection
    bound to admitted authority-layer-stage rows rather than as a freehand alternate
    authority ladder.
