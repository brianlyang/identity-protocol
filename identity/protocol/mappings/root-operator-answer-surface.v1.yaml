- order: 1
  limit_id: entry_boundary_not_law_preserving_compression
  contract_phrase: operator-entry boundary proof is not proof of law-preserving compression;
- order: 2
  limit_id: law_preserving_compression_not_support_confinement
  contract_phrase: law-preserving compression proof is not proof of support-surface confinement;
- order: 3
  limit_id: support_confinement_not_legality_terminal_preservation
  contract_phrase: support-surface confinement proof is not proof of legality-terminal preservation;
- order: 4
  limit_id: legality_terminal_not_realized_effect_backing
  contract_phrase: legality-terminal preservation proof is not proof of realized-effect answer backing;
- order: 5
  limit_id: realized_effect_backing_not_runtime_bypass
  contract_phrase: realized-effect answer-backing proof is not proof that answer prose may bypass current-turn machine adjudication.
- order: 6
  limit_id: realized_effect_backing_not_live_bound_status_backing
  contract_phrase: realized-effect answer-backing proof is not proof of live-bound status backing.
required_boundary_rows:
- order: 1
  boundary_id: operator_memory_burden
  contract_phrase: the operator should not bear the memory burden of low-level protocol
    law;
- order: 2
  boundary_id: support_not_answer
  contract_phrase: lower-layer proof may support the answer without replacing the
    answer surface itself;
- order: 3
  boundary_id: compression_without_bypass
  contract_phrase: operator simplicity must be achieved by law-preserving compression
    rather than by bypassing machine-law boundaries;
- order: 4
  boundary_id: terminality_not_answer_prose
  contract_phrase: current-turn legality must still terminate in machine-consumed
    enforcement surfaces rather than in answer prose alone.
required_collapse_rows:
- order: 1
  collapse_id: support_proof_equals_answer
  contract_phrase: supporting proof is treated as the operator answer itself.
- order: 2
  collapse_id: raw_internal_artifact_dumping
  contract_phrase: internal artifacts or raw protocol burden are dumped directly onto
    the operator as if dumping were an answer surface.
- order: 3
  collapse_id: convenience_overrides_law_compression
  contract_phrase: operator comfort or local convenience is used to bypass law-preserving
    compression and enforcement boundaries.
- order: 4
  collapse_id: answer_surface_seized_by_terminality
  contract_phrase: a machine terminal or receipt blob is treated as if it were the
    operator collaboration surface.
- order: 5
  collapse_id: prose_without_machine_truth
  contract_phrase: fluent answer prose is treated as sufficient despite missing machine-truth
    backing when such backing is required.
- order: 6
  collapse_id: realized_effect_claim_backed_by_earlier_strata
  contract_phrase: a realized-effect answer claim is treated as sufficiently backed
    by law-memory, discovery-memory, admissibility-memory, or run-binding-memory
    support alone.
- order: 7
  collapse_id: answer_claim_epistemic_flattening
  contract_phrase: law-grounded, canonical-source, admissibility, live-bound,
    and realized-effect answer claims are treated as if one current-truth proof
    stratum were sufficient for all of them.
operator_answer_surface_completeness_rows:
- order: 1
  completeness_id: explicit_operator_answer_surface_row_families
  contract_phrase: required surface, answer-surface-stage, answer-surface-stage-surface, support-memory, support-limit, answer-claim-alignment, answer-claim-epistemic-alignment, answer-surface-proof, answer-surface-limit, boundary, and collapse rows must remain explicit as separate machine-readable families;
- order: 2
  completeness_id: congruent_operator_answer_surface_row_family_totals
  contract_phrase: expected row-family total and emitted row-family total must remain congruent under machine-readable coverage completeness rather than being left implicit;
- order: 3
  completeness_id: explicit_operator_answer_surface_row_identity_sets
  contract_phrase: expected row identity set and emitted row identity set for each family must also remain machine-readable rather than being collapsed into aggregate counts;
- order: 4
  completeness_id: hidden_operator_answer_surface_identity_drift_forbidden
  contract_phrase: runtime or validator code must not finalize operator answer-surface legality while missing or unexpected row identities remain known only internally;
- order: 5
  completeness_id: fail_close_preserves_operator_answer_surface_identity_projection
  contract_phrase: fail-close machine output must preserve missing/unexpected row identity projection rather than hiding drift behind row-count shorthand or generic structure failure.
