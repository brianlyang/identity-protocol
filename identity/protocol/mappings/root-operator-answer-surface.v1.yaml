contract_required_markers:
- This file remains the authoritative root-domain contract for operator answer-surface
  law.
- '## Operator answer-surface law'
- '## Four answer-surface strata'
- Operator answer-surface law must also remain machine-readable as separate
  surface, support-memory, support-limit, answer-claim-alignment,
  answer-claim-epistemic-alignment, answer-surface-proof,
  answer-surface-limit, boundary, and collapse row families rather than one
  narrative answer claim.
- '## Compression boundary'
- '## Non-compliant answer-surface collapses'
- The protocol must not confuse support material, machine terminals, or internal artifacts
  with the answer surface actually delivered to the operator.
- '## Lifecycle-aware support-memory discipline'
- '## Support-memory limits'
- '## Answer-claim backing alignment'
- law-grounded answer claim requires law-memory support plus frozen-law decision-evidence
  proof;
- realized-effect answer claim requires consumption-memory support plus adjudicated-verdict-closure
  decision-evidence proof.
- '## Answer-claim epistemic alignment'
- law-grounded answer claim requires canonical-source current-truth proof;
- realized-effect answer claim requires provenance-preserving-derivation current-truth
  proof.
- '## Answer-surface proof discipline'
- '## Answer-surface proof limits'
