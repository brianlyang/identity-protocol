error_family: IP-MM
codes:
  - code: IP-MM-REG-001
    description: non-canonical plugin registry location or missing canonical registry files
  - code: IP-MM-NAME-001
    description: invalid plugin_id naming
  - code: IP-MM-NAME-002
    description: invalid file naming in plugin contract topology
  - code: IP-MM-THR-001
    description: invalid threshold values in plugin contract
  - code: IP-MM-PATH-001
    description: plugin root path escapes canonical protocol plugin root
  - code: IP-MM-COPY-001
    description: copied plugin contract/schema/adapter detected in instance runtime path
  - code: IP-MM-CONF-001
    description: provider profile id missing from central provider registry
  - code: IP-MM-CONF-002
    description: provider profile required fields malformed or missing
  - code: IP-MM-CONF-003
    description: provider credential reference unresolved or malformed
  - code: IP-MM-CONF-004
    description: provider endpoint policy violation (non-HTTPS or disallowed host)
  - code: IP-MM-CONF-005
    description: provider capability mismatch for plugin requirement
  - code: IP-MM-RUN-001
    description: runtime report missing for strict multimodal enforcement
  - code: IP-MM-RUN-002
    description: runtime report missing multimodal preflight stage evidence
  - code: IP-MM-RUN-003
    description: multimodal input gate skipped without approved bypass receipt
  - code: IP-MM-RUN-004
    description: required multimodal gate has unresolved items
  - code: IP-MM-RUN-005
    description: provider errors present and unrecovered in multimodal gate
  - code: IP-MM-RUN-006
    description: referenced multimodal runtime evidence artifact missing
  - code: IP-MM-RUN-007
    description: selected runtime report is not bound to current run id
